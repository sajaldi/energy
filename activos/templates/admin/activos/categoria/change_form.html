{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Estilos para las pestañas personalizadas */
    .nav-tabs-custom {
        margin-bottom: 20px;
        background: #fff;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        border-radius: 3px;
        display: flex;
        border-bottom: 1px solid #f4f4f4;
    }

    .nav-tabs-custom>.nav-item {
        margin-bottom: -1px;
    }

    .nav-tabs-custom>.nav-item>.nav-link {
        color: #444;
        border-radius: 0;
        border-top: 3px solid transparent;
        padding: 10px 15px;
    }

    .nav-tabs-custom>.nav-item>.nav-link.active {
        border-top-color: #3c8dbc;
        border-right-color: #f4f4f4;
        border-left-color: #f4f4f4;
        background-color: #fff;
        font-weight: bold;
    }

    /* Force full width for explorer */
    #content-main,
    #content,
    .content {
        width: 100% !important;
        max-width: none !important;
        margin-right: 0 !important;
        padding-right: 0 !important;
        box-sizing: border-box !important;
        overflow-x: hidden !important;
    }

    .tab-content {
        width: 100%;
    }
</style>
{% endblock %}

{% block content %}
<div id="content-main">
    {% if not is_popup and change and not add %}
        <ul class="nav nav-tabs mb-3" id="categoriaTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="form-tab" data-toggle="tab" data-target="#form-content" type="button"
                    role="tab">
                    <i class="fas fa-edit"></i> Datos de la Categoría
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="explorer-tab" data-toggle="tab" data-target="#explorer-content" type="button"
                    role="tab" onclick="loadExplorer()">
                    <i class="fas fa-sitemap"></i> Explorador de Activos
                </button>
            </li>
        </ul>

        <div class="tab-content" id="categoriaTabsContent">
            <!-- Contenido del Formulario -->
            <div class="tab-pane fade show active" id="form-content" role="tabpanel">
                {{ block.super }}
            </div>

            <!-- Contenido del Explorador -->
            <div class="tab-pane fade" id="explorer-content" role="tabpanel" style="min-height: 800px;">
                <div id="explorer-loader" class="text-center p-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Iniciando explorador...</p>
                </div>
                <iframe id="explorer-iframe" src="" frameborder="0"
                    style="width: 100%; height: calc(100vh - 160px); display: none; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.08);"></iframe>
            </div>
        </div>
    {% else %}
        {{ block.super }}
    {% endif %}
</div>

<script>
    function loadExplorer() {
        const iframe = document.getElementById('explorer-iframe');
        const loader = document.getElementById('explorer-loader');
        if (iframe.src === "" || iframe.src === window.location.href) {
            {% if object_id %}
            iframe.src = "{% url 'admin:activos_categoria_explorer' object_id=object_id %}";
            iframe.onload = function () {
                loader.style.display = 'none';
                iframe.style.display = 'block';
            };
            {% else %}
            loader.innerHTML = '<p class="text-muted">El explorador solo está disponible para categorías existentes.</p>';
            {% endif %}
        }
    }

    // Mantener la pestaña activa si se recarga (opcional)
    document.addEventListener('DOMContentLoaded', function () {
        // Podríamos usar localStorage para recordar la pestaña
    });
</script>
{% endblock %}
