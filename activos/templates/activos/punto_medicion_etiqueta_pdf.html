<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Etiqueta QR Punto de Medición</title>
    <style>
        @page {
            size: 3in 2in;
            margin: 0.05in;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            line-height: 1.1;
        }
        .container {
            width: 100%;
            margin-top: 5px;
            text-align: center;
        }
        .header {
            font-size: 11pt;
            font-weight: bold;
            color: #000;
            margin-bottom: 1px;
        }
        .subheader {
            font-size: 8.5pt;
            color: #444;
            margin-bottom: 2px;
        }
        .qr-code {
            text-align: center;
            margin-top: 2px;
            margin-bottom: 2px;
        }
        .qr-code img {
            width: 0.9in;
            height: 0.9in;
        }
        .footer {
            font-size: 6.5pt;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">PM: {{ punto.nombre|truncatechars:40 }}</div>
        <div class="subheader">{{ punto.activo.nombre|truncatechars:30 }} ({{ punto.activo.codigo_interno }})</div>
        <div class="qr-code">
            <img src="data:image/png;base64,{{ qr_code }}" />
        </div>
        <div class="footer">Escanear para Registrar Lectura</div>
    </div>
</body>
</html>
