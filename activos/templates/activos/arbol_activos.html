{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
<style>
    :root {
        /* SAP Fiori Horizon Colors */
        --fiori-shell-bg: #354a5f;
        --fiori-primary: #0a6ed1;
        --fiori-bg: #f5f6f7;
        --fiori-card-bg: #ffffff;
        --fiori-border: #d9d9d9;
        --fiori-text: #32363a;
        --fiori-text-secondary: #6a6d70;
        --fiori-success: #107e3e;
        --fiori-warning: #e9730c;
        --fiori-error: #bb0000;
        --fiori-selected: #ebf5fe;
    }

    body {
        font-family: 'Inter', '72', '72Full', Arial, Helvetica, sans-serif;
        background-color: var(--fiori-bg);
        color: var(--fiori-text);
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden;
    }

    /* SAP Shell Bar */
    .fiori-shell {
        height: 48px;
        background: var(--fiori-shell-bg);
        display: flex;
        align-items: center;
        padding: 0 16px;
        color: white;
        z-index: 100;
    }

    .fiori-shell-logo {
        height: 24px;
        margin-right: 24px;
    }

    .fiori-shell-title {
        font-size: 1rem;
        font-weight: 500;
    }

    /* Layout Containers */
    .fiori-root {
        display: flex;
        height: calc(100vh - 48px - 90px); /* Adjust for shell and admin header */
        width: 100vw;
    }

    #content-main, .content {
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
    }

    /* Master-Detail (Flexible Sidebar) */
    .fiori-master {
        width: 350px;
        background: var(--fiori-card-bg);
        border-right: 1px solid var(--fiori-border);
        display: flex;
        flex-direction: column;
        transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .fiori-master-header {
        padding: 16px;
        border-bottom: 1px solid var(--fiori-border);
    }

    .search-container {
        position: relative;
    }

    .search-container input {
        width: 100%;
        padding: 8px 32px 8px 12px;
        border: 1px solid var(--fiori-border);
        border-radius: 4px;
        font-size: 0.9rem;
        box-sizing: border-box;
    }

    .search-container ion-icon {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--fiori-primary);
    }

    .fiori-master-content {
        flex: 1;
        overflow-y: auto;
    }

    /* Tree Styling */
    .tree-node-item {
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        border-bottom: 1px solid #f0f0f0;
        transition: background 0.2s;
        font-size: 0.9rem;
    }

    .tree-node-item:hover {
        background: #f7f7f7;
    }

    .tree-node-item.active {
        background: var(--fiori-selected);
        border-left: 4px solid var(--fiori-primary);
    }

    .toggle-icon {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--fiori-text-secondary);
        transition: transform 0.2s;
    }

    .toggle-icon.expanded {
        transform: rotate(90deg);
    }

    .node-content-nested {
        display: none;
        padding-left: 24px; /* More padding for tree structure */
        background: #fafafa;
    }

    .node-content-nested.show {
        display: block;
    }

    /* Detail View */
    .fiori-detail {
        flex: 1;
        background: var(--fiori-bg);
        overflow-y: auto;
        padding: 24px;
        position: relative;
    }

    .fiori-object-page-header {
        background: white;
        border-radius: 8px;
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        border: 1px solid var(--fiori-border);
    }

    .object-page-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .object-page-subtitle {
        color: var(--fiori-text-secondary);
        font-size: 0.9rem;
    }

    /* Card Layout for Content */
    .fiori-section {
        background: white;
        border-radius: 8px;
        padding: 24px;
        margin-bottom: 24px;
        border: 1px solid var(--fiori-border);
    }

    .section-title {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* Grid for Stats */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
    }

    .info-tile {
        background: #f8f9fa;
        padding: 16px;
        border-radius: 6px;
        border-left: 4px solid var(--fiori-primary);
    }

    .tile-label {
        font-size: 0.75rem;
        color: var(--fiori-text-secondary);
        text-transform: uppercase;
        margin-bottom: 4px;
    }

    .tile-value {
        font-size: 1.2rem;
        font-weight: 700;
    }

    /* Category Blocks */
    .category-card {
        margin-bottom: 16px;
    }

    .category-header {
        padding: 12px 16px;
        background: #ebeef0;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.2s;
    }

    .category-header:hover {
        background: #e2e5e7;
    }

    .category-header .toggle-arrow {
        transition: transform 0.3s;
    }

    .category-card.collapsed .table-container {
        display: none;
    }

    .category-card.collapsed .toggle-arrow {
        transform: rotate(-90deg);
    }

    .section-search {
        margin-bottom: 20px;
        position: relative;
    }

    .section-search input {
        width: 100%;
        padding: 10px 40px 10px 14px;
        border: 1px solid var(--fiori-border);
        border-radius: 8px;
        font-size: 0.95rem;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }

    .section-search input:focus {
        border-color: var(--fiori-primary);
        outline: none;
        box-shadow: 0 0 0 3px rgba(10, 110, 209, 0.1);
    }

    .section-search ion-icon {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--fiori-text-secondary);
        font-size: 1.2rem;
    }

    /* Asset Table */
    .asset-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
    }

    .asset-table th {
        text-align: left;
        padding: 12px;
        font-size: 0.85rem;
        color: var(--fiori-text-secondary);
        border-bottom: 1px solid var(--fiori-border);
        background: #fafafa;
    }

    .asset-table td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        font-size: 0.9rem;
    }

    .asset-row:hover {
        background: #f5fafd;
        cursor: pointer;
    }

    /* State Badges */
    .status-badge {
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 600;
    }

    .status-OPERATIVO { background: #e7f4e9; color: #107e3e; }
    .status-MANTENIMIENTO { background: #fff4e5; color: #e9730c; }
    .status-REPARACION { background: #ffebee; color: #bb0000; }

    /* Side Detail Pane (For quick info) */
    .fiori-side-pane {
        width: 400px;
        background: white;
        border-left: 1px solid var(--fiori-border);
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    /* Simple Buttons */
    .btn-icon {
        background: transparent;
        border: none;
        color: var(--fiori-primary);
        font-size: 1.2rem;
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .btn-icon:hover {
        background: #f0f0f0;
    }

    /* Loaders */
    .loader {
        border: 3px solid #f3f3f3;
        border-top: 3px solid var(--fiori-primary);
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

</style>
{% endblock %}

{% block content %}
<!-- SAP Fiori Shell Bar -->
<div class="fiori-shell">
    <div class="fiori-shell-title">Gestión de Activos | Energía</div>
    <div style="margin-left: auto; display: flex; gap: 16px; align-items: center;">
        <ion-icon name="notifications-outline" style="font-size: 1.2rem; cursor: pointer;"></ion-icon>
        <div style="width: 32px; height: 32px; background: #ddd; border-top: 1px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: #333;">
            {{ user.username|slice:":2"|upper }}
        </div>
    </div>
</div>

<div class="fiori-root">
    <!-- Master View: Tree Explorer -->
    <div class="fiori-master">
        <div class="fiori-master-header">
            <div class="search-container">
                <input type="text" placeholder="Buscar ubicación o activo..." onkeyup="handleSearch(this.value)">
                <ion-icon name="search-outline"></ion-icon>
            </div>
        </div>
        <div class="fiori-master-content" id="tree-container">
            <div class="loader"></div>
        </div>
    </div>

    <!-- Detail View: Main Content Area -->
    <div class="fiori-detail" id="main-content">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80%; color: #999;">
            <ion-icon name="business-outline" style="font-size: 4rem; opacity: 0.3;"></ion-icon>
            <h3 style="margin-top: 20px;">Selecciona una ubicación</h3>
            <p>Navega a través del árbol para ver el inventario detallado.</p>
        </div>
    </div>

    <!-- Right Side Pane: Asset Detail Quick View -->
    <div class="fiori-side-pane" id="quick-view" style="display: none;">
        <!-- Injected via JS -->
    </div>
</div>

<!-- Template for Tree Item -->
<template id="tree-item-template">
    <div class="tree-node-wrapper">
        <div class="tree-node-item" onclick="handleSelectNode(this)">
            <div class="toggle-icon" onclick="toggleNested(event, this)">
                <ion-icon name="chevron-forward-outline"></ion-icon>
            </div>
            <ion-icon name="location-outline" class="item-icon"></ion-icon>
            <span class="item-label"></span>
        </div>
        <div class="node-content-nested"></div>
    </div>
</template>

<script>
    let currentActiveNode = null;

    document.addEventListener('DOMContentLoaded', () => {
        loadRoots();
    });

    async function loadRoots() {
        const container = document.getElementById('tree-container');
        try {
            const res = await fetch('/activos/api/ubicaciones-root/');
            const data = await res.json();
            renderLevel(data, container);
        } catch (e) {
            container.innerHTML = '<p style="padding:20px; color:red;">Error al cargar</p>';
        }
    }

    function renderLevel(nodes, container) {
        container.innerHTML = '';
        nodes.forEach(node => {
            const template = document.getElementById('tree-item-template').content.cloneNode(true);
            const wrapper = template.querySelector('.tree-node-wrapper');
            const item = template.querySelector('.tree-node-item');
            const label = template.querySelector('.item-label');
            const toggle = template.querySelector('.toggle-icon');
            const icon = template.querySelector('.item-icon');

            wrapper.dataset.id = node.id;
            label.textContent = node.nombre;
            
            if (node.tipo === 'EDIFICIO') icon.setAttribute('name', 'business');
            else if (node.tipo === 'NIVEL') icon.setAttribute('name', 'layers');
            else icon.setAttribute('name', 'location');

            if (!node.has_children) {
                toggle.style.opacity = '0';
                toggle.style.pointerEvents = 'none';
            } else {
                toggle.dataset.loaded = 'false';
            }

            container.appendChild(template);
        });
    }

    async function toggleNested(e, el) {
        e.stopPropagation();
        const wrapper = el.closest('.tree-node-wrapper');
        const nested = wrapper.querySelector('.node-content-nested');
        const icon = el.querySelector('ion-icon');
        const id = wrapper.dataset.id;

        if (nested.classList.contains('show')) {
            nested.classList.remove('show');
            el.classList.remove('expanded');
            icon.setAttribute('name', 'chevron-forward-outline');
        } else {
            nested.classList.add('show');
            el.classList.add('expanded');
            icon.setAttribute('name', 'chevron-down-outline');

            if (el.dataset.loaded === 'false') {
                nested.innerHTML = '<div style="padding:10px;"><div class="loader" style="width:15px; height:15px; border-width:2px;"></div></div>';
                const res = await fetch(`/activos/api/ubicaciones-children/${id}/`);
                const data = await res.json();
                renderLevel(data, nested);
                el.dataset.loaded = 'true';
            }
        }
    }

    async function handleSelectNode(el) {
        if (currentActiveNode) currentActiveNode.classList.remove('active');
        el.classList.add('active');
        currentActiveNode = el;

        const id = el.closest('.tree-node-wrapper').dataset.id;
        loadUbicacionDetail(id);
    }

    async function loadUbicacionDetail(id) {
        const container = document.getElementById('main-content');
        container.innerHTML = '<div class="loader"></div>';

        try {
            const res = await fetch(`/activos/api/ubicacion-detalle/${id}/`);
            const data = await res.json();
            renderObjectPage(data, container);
        } catch (e) {
            container.innerHTML = '<p>Error al cargar detalles</p>';
        }
    }

    const isSelectionMode = new URLSearchParams(window.location.search).has('select');

    function renderObjectPage(data, container) {
        const u = data.ubicacion;
        let html = `
            <div class="fiori-object-page-header">
                <div class="object-page-subtitle">${u.ruta}</div>
                <h1 class="object-page-title">${u.nombre}</h1>
                <div style="display: flex; gap: 8px;">
                    <span class="status-badge" style="background:#e8f0f7; color:#0a6ed1;">${u.tipo}</span>
                </div>
            </div>

            <div class="fiori-section">
                <div class="section-title"><ion-icon name="stats-chart-outline"></ion-icon> Resumen Ejecutivo</div>
                <div class="stats-grid">
                    <div class="info-tile">
                        <div class="tile-label">Total Activos</div>
                        <div class="tile-value">${data.total_activos}</div>
                    </div>
                    <div class="info-tile" style="border-left-color: var(--fiori-success);">
                        <div class="tile-label">Operativos</div>
                        <div class="tile-value">${data.activos_operativos}</div>
                    </div>
                    <div class="info-tile" style="border-left-color: var(--fiori-warning);">
                        <div class="tile-label">Ocupación</div>
                        <div class="tile-value">${Math.round((data.activos_operativos/data.total_activos)*100 || 0)}%</div>
                    </div>
                </div>
            </div>

            <div class="fiori-section">
                <div class="section-title"><ion-icon name="list-outline"></ion-icon> Inventario de Equipos</div>
                <div class="section-search">
                    <input type="text" id="equipment-search" placeholder="Filtrar equipos por nombre, código o modelo..." onkeyup="filterEquipment(this.value)">
                    <ion-icon name="funnel-outline"></ion-icon>
                </div>
        `;

        if (data.categorias.length === 0) {
            html += '<p style="color:#999; text-align:center; padding:40px;">No hay activos asignados directamente a esta ubicación.</p>';
        } else {
            data.categorias.forEach((cat, idx) => {
                const catId = 'cat-block-' + idx;
                html += `
                    <div class="category-card collapsed" id="${catId}">
                        <div class="category-header" onclick="toggleCategory('${catId}')">
                            <ion-icon name="${cat.icono || 'cube'}"></ion-icon>
                            <span>${cat.nombre}</span>
                            <span style="margin-left:auto; opacity:0.6; font-size: 0.8rem; margin-right: 10px;">${cat.total_items} items</span>
                            <ion-icon name="chevron-down-outline" class="toggle-arrow"></ion-icon>
                        </div>
                        <div class="table-container">
                            <table class="asset-table">
                                <thead>
                                    <tr>
                                        <th>Código</th>
                                        <th>Nombre</th>
                                        <th>Modelo/Marca</th>
                                        <th>Desc. Modelo</th>
                                        <th>Desc. Activo</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                cat.subcategorias.forEach(sub => {
                    sub.activos.forEach(a => {
                        html += `
                            <tr class="asset-row" onclick="${isSelectionMode ? `selectAsset(${a.id}, '${a.nombre.replace(/'/g, "\\'")}')` : `viewAsset(${a.id})`}">
                                <td style="font-weight:700; color:var(--fiori-primary);">${a.codigo}</td>
                                <td>${a.nombre}</td>
                                <td>${a.modelo || '-'}</td>
                                <td style="color:var(--fiori-text-secondary); font-size:0.8rem;">${a.modelo_descripcion || '-'}</td>
                                <td style="color:var(--fiori-text-secondary); font-size:0.8rem;">${a.descripcion || '-'}</td>
                                <td><span class="status-badge status-${a.estado}">${a.estado_display}</span></td>
                                <td>
                                    ${isSelectionMode ? `
                                    <button class="btn-icon" style="background:var(--fiori-primary); color:white; padding:4px 12px; font-size:0.75rem; border-radius:12px;">
                                        Seleccionar
                                    </button>
                                    ` : `
                                    <button class="btn-icon" onclick="event.stopPropagation(); window.location.href='/activos/editar-activo/${a.id}/'">
                                        <ion-icon name="create-outline"></ion-icon>
                                    </button>
                                    `}
                                </td>
                            </tr>
                        `;
                    });
                });

                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });
        }

        html += '</div>';
        container.innerHTML = html;
    }

    async function selectAsset(id, name) {
        if (window.parent && window.parent.onAssetSelected) {
            window.parent.onAssetSelected(id, name);
        }
    }

    async function viewAsset(id) {
        const pane = document.getElementById('quick-view');
        pane.style.display = 'block';
        pane.innerHTML = '<div class="loader"></div>';

        // Add a close button
        try {
            const res = await fetch(`/activos/api/activo-detalle/${id}/`);
            const a = await res.json();
            
            pane.innerHTML = `
                <div style="padding:16px; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="margin:0;">Ficha del Activo</h3>
                    <ion-icon name="close-outline" style="cursor:pointer; font-size:1.5rem;" onclick="document.getElementById('quick-view').style.display='none'"></ion-icon>
                </div>
                <div style="padding:24px; flex:1; overflow-y:auto;">
                    ${a.foto_url ? `<img src="${a.foto_url}" style="width:100%; height:200px; object-fit:cover; border-radius:8px; margin-bottom:20px;">` : ''}
                    
                    <div style="margin-bottom:24px;">
                        <div class="object-page-subtitle">ID: #${a.id}</div>
                        <h2 style="margin:4px 0;">${a.nombre}</h2>
                        <span class="status-badge status-${a.estado}">${a.estado_display}</span>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr; gap:16px;">
                        <div class="info-tile" style="border-left:none; background:#f0f3f5;">
                            <div class="tile-label">Código Interno</div>
                            <div class="tile-value">${a.codigo_interno || 'S/C'}</div>
                        </div>
                        <div class="info-tile" style="border-left:none; background:#f0f3f5;">
                            <div class="tile-label">Marca / Modelo</div>
                            <div class="tile-value">${a.marca || '-'} / ${a.modelo || '-'}</div>
                        </div>
                        <div class="info-tile" style="border-left:none; background:#f0f3f5;">
                            <div class="tile-label">Responsable</div>
                            <div class="tile-value">${a.responsable}</div>
                        </div>
                        <div class="info-tile" style="border-left:none; background:#f0f3f5;">
                            <div class="tile-label">Ubicación</div>
                            <div class="tile-value" style="font-size:0.9rem;">${a.ubicacion}</div>
                        </div>
                    </div>

                    <div style="margin-top:24px; padding-top:16px; border-top:1px solid #eee;">
                        <button onclick="window.location.href='/activos/editar-activo/${a.id}/'" style="width:100%; padding:12px; background:var(--fiori-primary); color:white; border:none; border-radius:4px; font-weight:700; cursor:pointer;">
                            Editar Perfil Completo
                        </button>
                    </div>
                </div>
            `;
        } catch (e) {
            pane.innerHTML = '<p>Error al cargar</p>';
        }
    }

    async function handleSearch(q) {
        if (!q || q.length < 2) return;
        // Optional implementation for global search
    }

    function toggleCategory(id) {
        const card = document.getElementById(id);
        if (card) card.classList.toggle('collapsed');
    }

    function filterEquipment(q) {
        const query = q.toLowerCase().trim();
        const rows = document.querySelectorAll('.asset-row');
        const cards = document.querySelectorAll('.category-card');
        
        if (query === '') {
            rows.forEach(r => r.style.display = '');
            cards.forEach(c => {
                c.style.display = '';
                c.classList.add('collapsed');
            });
            return;
        }

        cards.forEach(card => {
            let hasVisible = false;
            const cardRows = card.querySelectorAll('.asset-row');
            
            cardRows.forEach(row => {
                const text = row.innerText.toLowerCase();
                if (text.includes(query)) {
                    row.style.display = '';
                    hasVisible = true;
                } else {
                    row.style.display = 'none';
                }
            });

            if (hasVisible) {
                card.style.display = '';
                card.classList.remove('collapsed');
            } else {
                card.style.display = 'none';
            }
        });
    }
</script>
{% endblock %}
