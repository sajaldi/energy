{% extends "portalsub/base.html" %}
{% load static %}

{% block title %}Notificaciones{% endblock %}
{% block header_title %}Notificaciones{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'notificaciones/css/notificaciones.css' %}">
<style>
    .notif-page-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .notif-page-item {
        display: flex;
        gap: 12px;
        padding: 14px 16px;
        background: white;
        border-radius: var(--sap-border-radius);
        border: 1px solid var(--sap-card-border);
        transition: all 0.15s;
        text-decoration: none;
        color: inherit;
    }
    .notif-page-item:hover {
        border-color: var(--sap-primary);
        box-shadow: 0 2px 8px rgba(0,112,242,0.08);
    }
    .notif-page-item.unread {
        background: #f0f7ff;
        border-left: 3px solid var(--sap-primary);
    }
    .notif-page-item .notif-item-icon {
        font-size: 1.4rem;
        margin-top: 2px;
    }
    .notif-page-item .notif-item-title {
        font-size: 0.9rem;
        font-weight: 600;
        color: #1e293b;
    }
    .notif-page-item .notif-item-msg {
        font-size: 0.8rem;
        color: #64748b;
        margin-top: 2px;
    }
    .notif-page-item .notif-item-time {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-top: 4px;
    }
    .notif-filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }
    .notif-filters select, .notif-filters input {
        padding: 8px 10px;
        border: 1px solid var(--sap-card-border);
        border-radius: var(--sap-border-radius);
        font-size: 0.8rem;
        font-family: inherit;
        background: white;
        flex: 1;
        min-width: 100px;
    }
    .notif-filters .btn-filter {
        padding: 8px 16px;
        background: var(--sap-primary);
        color: white;
        border: none;
        border-radius: var(--sap-border-radius);
        font-weight: 600;
        cursor: pointer;
        font-size: 0.8rem;
    }
    .notif-pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
    }
    .notif-pagination button {
        padding: 8px 14px;
        border: 1px solid var(--sap-card-border);
        border-radius: var(--sap-border-radius);
        background: white;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.8rem;
    }
    .notif-pagination button:disabled {
        opacity: 0.5;
        cursor: default;
    }
    .notif-pagination span {
        font-size: 0.8rem;
        color: #64748b;
    }
    .notif-mark-read {
        padding: 4px 10px;
        background: transparent;
        border: 1px solid var(--sap-card-border);
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.7rem;
        color: #64748b;
        margin-top: 4px;
    }
    .notif-mark-read:hover {
        background: #f1f5f9;
    }
    .notif-empty-state {
        text-align: center;
        padding: 40px 16px;
        color: #999;
    }
    .notif-empty-state ion-icon {
        font-size: 3rem;
        color: #ddd;
        margin-bottom: 8px;
    }
    .notif-empty-state h2 {
        font-size: 1rem;
        color: #666;
        margin-bottom: 4px;
    }
    .notif-empty-state p {
        font-size: 0.85rem;
        margin: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="notif-filters">
    <select id="filter-tipo">
        <option value="">Todos</option>
        {% for t in tipos %}
        <option value="{{ t.value }}">{{ t.label }}</option>
        {% endfor %}
    </select>
    <select id="filter-leida">
        <option value="">Todas</option>
        <option value="0">No leídas</option>
        <option value="1">Leídas</option>
    </select>
    <button class="btn-filter" onclick="notifPage.filter()">Filtrar</button>
</div>

<div id="notif-list" class="notif-page-list">
    <div class="notif-empty-state">
        <ion-icon name="hourglass-outline"></ion-icon>
        <p>Cargando...</p>
    </div>
</div>

<div class="notif-pagination" id="notif-pagination"></div>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'notificaciones/js/notificaciones.js' %}"></script>
<script>
    const notifPage = {
        currentPage: 1,

        async loadPage(page) {
            this.currentPage = page || 1;
            const tipo = document.getElementById('filter-tipo').value;
            const leida = document.getElementById('filter-leida').value;
            const params = new URLSearchParams({
                page: this.currentPage,
                per_page: 20,
            });
            if (tipo) params.set('tipo', tipo);
            if (leida) params.set('leida', leida);
            try {
                const res = await fetch('{% url "notificaciones:api_todas" %}?' + params.toString());
                const data = await res.json();
                this.render(data);
            } catch (e) {
                document.getElementById('notif-list').innerHTML = `
                    <div class="notif-empty-state"><ion-icon name="cloud-offline-outline"></ion-icon><p>Error al cargar.</p></div>`;
            }
        },

        render(data) {
            const container = document.getElementById('notif-list');
            const pagination = document.getElementById('notif-pagination');
            if (data.notificaciones.length === 0) {
                container.innerHTML = `
                    <div class="notif-empty-state">
                        <ion-icon name="notifications-off-outline"></ion-icon>
                        <h2>Sin notificaciones</h2>
                        <p>No hay notificaciones para mostrar.</p>
                    </div>`;
                pagination.innerHTML = '';
                return;
            }
            let html = '';
            data.notificaciones.forEach(n => {
                const link = n.enlace || '#';
                html += `
                    <a href="${link}" class="notif-page-item ${n.leida ? '' : 'unread'}" data-id="${n.id}">
                        <div class="notif-item-icon ${n.tipo.toLowerCase()}">
                            <ion-icon name="${n.icono || 'information-circle'}"></ion-icon>
                        </div>
                        <div class="notif-item-content" style="flex:1;">
                            <div class="notif-item-title">${n.titulo}</div>
                            <div class="notif-item-msg">${n.mensaje}</div>
                            <div class="notif-item-time">${n.creado_en} (${n.tiempo})</div>
                        </div>
                        ${!n.leida ? `<button class="notif-mark-read" onclick="event.preventDefault(); event.stopPropagation(); notifPage.markRead(${n.id}, this)">✓ Leída</button>` : ''}
                    </a>`;
            });
            container.innerHTML = html;
            let phtml = '';
            phtml += `<button onclick="notifPage.loadPage(${data.page - 1})" ${data.page <= 1 ? 'disabled' : ''}>< Anterior</button>`;
            phtml += `<span>${data.page} / ${data.pages}</span>`;
            phtml += `<button onclick="notifPage.loadPage(${data.page + 1})" ${data.page >= data.pages ? 'disabled' : ''}>Siguiente ></button>`;
            pagination.innerHTML = phtml;
        },

        filter() { this.loadPage(1); },

        async markRead(id, btn) {
            try {
                await fetch('{% url "notificaciones:api_marcar_leida" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ notif_id: id })
                });
                const item = btn.closest('.notif-page-item');
                item.classList.remove('unread');
                btn.remove();
            } catch (e) {}
        }
    };
    document.addEventListener('DOMContentLoaded', () => notifPage.loadPage(1));
</script>
{% endblock %}
