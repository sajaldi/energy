{% extends "admin/base_site.html" %}
{% load static %}
{% block title %}Eliminar Recurso{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="card border-danger">
    <div class="card-header bg-danger text-white"><h4>Confirmar Eliminación</h4></div>
    <div class="card-body">
      <p>¿Eliminar el recurso <strong>{{ object.display_nombre }}</strong> del ACU {{ analisis.codigo }}?</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Eliminar</button>
          <a href="{% url 'costos:analisis_detail' analisis.pk %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
