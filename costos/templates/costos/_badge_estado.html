{% if estado == 'BORRADOR' %}<span class="badge bg-secondary">Borrador</span>
{% elif estado == 'APROBADO' %}<span class="badge bg-success">Aprobado</span>
{% elif estado == 'OBSOLETO' %}<span class="badge bg-danger">Obsoleto</span>
{% else %}<span class="badge bg-dark">{{ estado }}</span>{% endif %}
