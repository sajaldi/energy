{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente AI: Contrato CCG</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .bot-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        #chat-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: white;
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .message.loading {
            background: #f1f5f9;
            color: var(--text-muted);
            font-style: italic;
        }

        #input-area {
            background: white;
            border-top: 1px solid var(--border);
            padding: 20px 24px;
            display: flex;
            gap: 12px;
        }

        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        #message-input:focus {
            border-color: var(--primary);
        }

        #send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #send-btn:hover {
            opacity: 0.9;
        }

        #send-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        pre {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <header>
        <div class="bot-icon">AI</div>
        <div>
            <h2 style="margin: 0; font-size: 1.1rem;">Asistente de Contrato</h2>
            <p style="margin: 0; font-size: 0.75rem; color: var(--text-muted);">Consultas sobre el Contrato CCG</p>
        </div>
    </header>

    <div id="chat-container">
        <div class="message bot">
            ¡Hola! Soy tu asistente experto en el Contrato del CCG. ¿En qué puedo ayudarte hoy?
        </div>
    </div>

    <div id="input-area">
        <input type="text" id="message-input" placeholder="Escribe tu pregunta sobre el contrato..." autocomplete="off">
        <button id="send-btn">Enviar</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, side, isLoading = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${side} ${isLoading ? 'loading' : ''}`;

            // Format line breaks
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const msg = messageInput.value.trim();
            if (!msg) return;

            messageInput.value = '';
            appendMessage(msg, 'user');

            const loadingMsg = appendMessage('Consultando el contrato...', 'bot', true);

            sendBtn.disabled = true;

            try {
                const response = await fetch('', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ mensaje: msg })
                });

                const data = await response.json();
                loadingMsg.remove();

                if (data.status === 'success') {
                    appendMessage(data.respuesta, 'bot');
                } else {
                    appendMessage('Lo siento, hubo un error al procesar tu consulta: ' + data.message, 'bot');
                }
            } catch (err) {
                loadingMsg.remove();
                appendMessage('Error de conexión con el servidor AI.', 'bot');
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>

</html>
