<div class="ubicacion-tree">
    {% for u in ubicaciones_roots %}
        {% with node=u parent_id=None %}
            {% include 'proyectos/partials/tree_ubicacion_node.html' %}
        {% endwith %}
    {% endfor %}
</div>
<div id="ubicacion-selected-bar" class="ubicacion-selected" style="display: none;">
    <span>Seleccionado: <strong id="ubicacion-selected-name"></strong></span>
    <button type="button" class="clear-btn clear-ubicacion" title="Limpiar selección">✕</button>
</div>
