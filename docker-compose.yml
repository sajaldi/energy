version: '3.8'

services:
  web:
    build:
      context: .
      cache_from:
        - energia-base:latest
    command: gunicorn energia.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 600
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  celery_worker:
    build:
      context: .
      cache_from:
        - energia-base:latest
    command: celery -A energia worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    volumes:
      - ./media:/app/media
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
    depends_on:
      - redis
      - web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A energia inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_beat:
    build:
      context: .
      cache_from:
        - energia-base:latest
    command: celery -A energia beat --loglevel=info
    volumes:
      - ./media:/app/media
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
    depends_on:
      - redis
      - web
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
