<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enlace inválido — SoftCoM</title>
  <style>
    :root {
      --sap-shell-bg: #354a5e;
      --sap-bg-color: #f5f6f7;
      --sap-card-bg: #ffffff;
      --sap-border-color: #e5e5e5;
      --sap-text-color: #32363a;
      --sap-text-muted: #6a6d70;
      --sap-error: #bb0000;
      --sap-brand-color: #0070f2;
      --sap-border-radius: 4px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "72", Arial, sans-serif;
      background: var(--sap-bg-color); color: var(--sap-text-color);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    .shell {
      background: var(--sap-shell-bg); height: 44px;
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
    }
    .shell-logo { font-size: 16px; font-weight: 700; color: #fff; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .fd-card {
      background: #fff; border: 1px solid var(--sap-border-color);
      border-radius: var(--sap-border-radius); box-shadow: 0 2px 8px rgba(0,0,0,.08);
      width: 100%; max-width: 440px; text-align: center; overflow: hidden;
    }
    .fd-card__top { background: #fff1f1; border-bottom: 3px solid var(--sap-error); padding: 32px 24px 24px; }
    .fd-card__top .icon { font-size: 48px; display: block; margin-bottom: 12px; }
    .fd-card__top h2 { font-size: 18px; font-weight: 700; color: var(--sap-error); }
    .fd-card__body { padding: 24px; }
    .fd-card__body p { font-size: 13px; color: var(--sap-text-muted); line-height: 1.6; margin-bottom: 8px; }
    .fd-card__body .err-msg { font-weight: 600; color: var(--sap-error); font-size: 14px; margin-bottom: 16px; }
    .fd-button {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--sap-brand-color); color: #fff; border: none;
      border-radius: var(--sap-border-radius); padding: 10px 24px;
      font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; text-decoration: none; margin-top: 8px;
    }
    .fd-button:hover { background: #0064d9; }
    .fd-card__footer {
      padding: 12px 24px; border-top: 1px solid var(--sap-border-color);
      font-size: 11px; color: var(--sap-text-muted);
    }
  </style>
</head>
<body>
<div class="shell">
  <span class="shell-logo">&#9671; SoftCoM</span>
</div>
<div class="main">
  <div class="fd-card">
    <div class="fd-card__top">
      <span class="icon">&#9888;&#65039;</span>
      <h2>Enlace no válido</h2>
    </div>
    <div class="fd-card__body">
      <p class="err-msg">{{ error }}</p>
      <p>Si necesitas acceso, contacta al administrador del sistema para que te reenvíe la invitación.</p>
      <a href="/admin/" class="fd-button">&#10140; Ir al login</a>
    </div>
    <div class="fd-card__footer">SoftCoM &mdash; Sistema de Gestión de Mantenimiento &middot; CCG</div>
  </div>
</div>
</body>
</html>
