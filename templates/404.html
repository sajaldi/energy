{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - SoftCom CCG</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    {% include 'core/fiori_tokens.html' %}
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: var(--sap-font-family);
            background-color: var(--sap-bg-color);
            color: var(--sap-text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Fiori ShellBar */
        .fiori-shellbar {
            background-color: var(--sap-shell-bg);
            color: var(--sap-shell-color);
            height: 2.75rem;
            display: flex;
            align-items: center;
            padding: 0 2rem;
            box-shadow: inset 0 -0.0625rem 0 rgba(0, 0, 0, 0.15);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }

        .shellbar-logo {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: 0.02rem;
        }

        .shellbar-logo ion-icon {
            font-size: 1.25rem;
        }

        /* Fiori MessagePage */
        .message-page-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            margin-top: 2.75rem; /* Offset for ShellBar */
        }

        .message-page {
            max-width: 600px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .message-icon {
            font-size: 6rem;
            color: var(--sap-neutral);
            margin-bottom: 2rem;
            line-height: 1;
        }

        .message-title {
            font-size: 1.5rem;
            font-weight: 400;
            margin: 0 0 1rem 0;
            color: var(--sap-text-color);
            font-family: var(--sap-font-family);
        }

        .message-description {
            font-size: 1rem;
            color: var(--sap-text-muted);
            margin: 0 0 2.5rem 0;
            line-height: 1.4;
            max-width: 450px;
        }

        .message-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        /* Enhanced Fiori Buttons */
        .sap-btn {
            height: 2.25rem;
            padding: 0 1rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.1s ease;
            border: 1px solid transparent;
            font-family: var(--sap-font-family);
            min-width: 8rem;
        }

        .sap-btn:active {
            transform: scale(0.98);
        }

        .sap-btn-emphasized {
            background-color: var(--sap-brand-color);
            color: white;
            border-color: var(--sap-brand-color);
        }

        .sap-btn-emphasized:hover {
            background-color: var(--sap-highlight-color);
            border-color: var(--sap-highlight-color);
        }

        .sap-btn-transparent {
            background-color: transparent;
            color: var(--sap-brand-color);
            border-color: transparent;
        }

        .sap-btn-transparent:hover {
            background-color: var(--sap-information-bg);
        }
    </style>
</head>
<body>
    <header class="fiori-shellbar">
        <div class="shellbar-logo">
            <ion-icon name="layers"></ion-icon>
            SoftCom CCG
        </div>
    </header>

    <main class="message-page-container">
        <div class="message-page">
            <div class="message-icon">
                <ion-icon name="document-text-outline"></ion-icon>
            </div>
            <h1 class="message-title">Página no encontrada</h1>
            <p class="message-description">Lo sentimos, no pudimos encontrar esa página. Puede que la dirección esté mal escrita o la página haya sido movida.</p>
            
            <div class="message-actions">
                <a href="/" class="sap-btn sap-btn-emphasized">Ir al Inicio</a>
                <button onclick="history.back()" class="sap-btn sap-btn-transparent">Regresar</button>
            </div>
        </div>
    </main>
</body>
</html>
