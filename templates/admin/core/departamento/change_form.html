{% extends "admin/change_form.html" %}
{% load i18n admin_urls static admin_modify %}

{% block extrahead %}
{{ block.super }}
<style>
.admin-tabs { margin-top: 20px; }
.admin-tabs .tab-nav { display: flex; gap: 0; border-bottom: 2px solid #d9d9d9; margin-bottom: 0; }
.admin-tabs .tab-nav button {
    padding: 10px 20px; font-size: 13px; font-weight: 600; color: #605e5c;
    background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -2px;
    cursor: pointer; transition: all 0.15s; font-family: inherit;
}
.admin-tabs .tab-nav button:hover { color: #0078d4; background: #f3f2f1; }
.admin-tabs .tab-nav button.active { color: #0078d4; border-bottom-color: #0078d4; }
.admin-tabs .tab-panel { display: none; padding: 20px 0; }
.admin-tabs .tab-panel.active { display: block; }
.admin-tabs .tab-panel .inline-group { margin: 0; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function() {
    var inlineGroup = document.querySelector('.inline-group');
    if (!inlineGroup) return;
    var inlineTabContent = inlineGroup.innerHTML;
    inlineGroup.innerHTML = '';
    var tabsDiv = document.createElement('div');
    tabsDiv.className = 'admin-tabs';
    tabsDiv.innerHTML = '<div class="tab-nav"><button class="active" data-tab="tab-general">General</button><button data-tab="tab-miembros">Miembros del Departamento</button></div>' +
        '<div class="tab-panel active" id="tab-general"></div>' +
        '<div class="tab-panel" id="tab-miembros">' + inlineTabContent + '</div>';
    inlineGroup.parentNode.insertBefore(tabsDiv, inlineGroup);
    inlineGroup.remove();
    document.querySelectorAll('.tab-nav button').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-nav button, .tab-panel').forEach(function(el) { el.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
        });
    });
});
</script>
{% endblock %}

{% block inline_field_sets %}
{% endblock %}
