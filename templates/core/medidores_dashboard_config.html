{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<style>
    .config-container { max-width: 800px; margin: 0 auto; }
    .config-section {
        background: #fff; border: 1px solid #d9d9d9; border-radius: 0.5rem;
        padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.08);
    }
    .config-section h3 { font-size: 1rem; font-weight: 600; margin: 0 0 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 0.5rem; }
    .config-section h3 i { color: #0070f2; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 0.82rem; font-weight: 500; color: #32363a; }
    .form-group input, .form-group select { padding: 0.5rem 0.75rem; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 0.85rem; font-family: inherit; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #0070f2; box-shadow: 0 0 0 2px rgba(0,112,242,0.1); }
    .medidores-list { max-height: 400px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 4px; padding: 0.5rem; }
    .medidor-option { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; border-bottom: 1px solid #f3f4f6; font-size: 0.83rem; }
    .medidor-option:last-child { border-bottom: none; }
    .medidor-option:hover { background: #f8fafc; }
    .medidor-option input { width: 16px; height: 16px; accent-color: #0070f2; }
    .btn-row { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .btn-save { padding: 0.6rem 1.5rem; background: #0070f2; color: #fff; border: none; border-radius: 4px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; }
    .btn-save:hover { background: #0059c7; }
    .btn-preview { padding: 0.6rem 1.5rem; background: #fff; color: #0070f2; border: 1px solid #0070f2; border-radius: 4px; font-weight: 600; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
    .search-input { width: 100%; padding: 0.5rem; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 0.85rem; margin-bottom: 0.5rem; }
</style>

<div class="config-container">
    <form method="post">
        {% csrf_token %}
        <div class="config-section">
            <h3><i class="fas fa-cog"></i> General</h3>
            <div class="form-grid">
                <div class="form-group full">
                    <label for="titulo">Título del Dashboard</label>
                    <input type="text" name="titulo" id="titulo" value="{{ config.titulo }}">
                </div>
                <div class="form-group">
                    <label for="intervalo_refresh">Intervalo de Refresco (segundos)</label>
                    <input type="number" name="intervalo_refresh" id="intervalo_refresh" value="{{ config.intervalo_refresh }}" min="10" max="600">
                </div>
            </div>
        </div>

        <div class="config-section">
            <h3><i class="fas fa-tachometer-alt"></i> Medidores a Mostrar</h3>
            <p style="font-size: 0.8rem; color: #6a6d70; margin-bottom: 0.75rem;">Si no seleccionas ninguno, se muestran todos.</p>
            <input type="text" class="search-input" placeholder="Buscar medidor..." oninput="filterMedidores(this.value)">
            <div class="medidores-list" id="medidores-list">
                {% for m in medidores_todos %}
                <label class="medidor-option">
                    <input type="checkbox" name="medidores" value="{{ m.id }}" {% if m.id in selected_ids %}checked{% endif %}>
                    {{ m.nombre }} <span style="color:#6a6d70; font-size:0.72rem;">{% if m.tipo_medidor %}({{ m.tipo_medidor }}){% endif %}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="btn-row">
            <button type="submit" class="btn-save"><i class="fas fa-save"></i> Guardar</button>
            <a href="{% url 'core:medidores_tv_dashboard' %}" target="_blank" class="btn-preview"><i class="fas fa-external-link-alt"></i> Ver Dashboard TV</a>
        </div>
    </form>
</div>

<script>
function filterMedidores(q) {
    var items = document.querySelectorAll('#medidores-list .medidor-option');
    q = q.toLowerCase();
    items.forEach(function(el) { el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none'; });
}
</script>
{% endblock %}
