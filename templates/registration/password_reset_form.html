<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña — SoftCoM</title>
  <style>
    :root { --brand:#0070f2; --brand-h:#0064d9; --shell:#354a5e; --bg:#f5f6f7;
            --card:#fff; --border:#e5e5e5; --text:#32363a; --muted:#6a6d70;
            --error:#bb0000; --error-bg:#fff1f1; --radius:4px; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Artifakt Element',"72",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    .shell{background:var(--shell);height:44px;display:flex;align-items:center;padding:0 16px;gap:12px}
    .shell-logo{font-size:16px;font-weight:700;color:#fff}
    .shell-title{font-size:13px;color:rgba(255,255,255,.7)}
    .main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
    .fd-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
             box-shadow:0 2px 8px rgba(0,0,0,.08);width:100%;max-width:460px}
    .fd-card__header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
    .hdr-icon{width:40px;height:40px;background:var(--shell);border-radius:50%;display:flex;
              align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
    .hdr-content h2{font-size:16px;font-weight:700}
    .hdr-content p{font-size:12px;color:var(--muted);margin-top:2px}
    .fd-card__body{padding:24px}
    .fd-card__footer{padding:12px 24px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center}
    .fd-form-group{margin-bottom:20px}
    .fd-label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
    .fd-label .req{color:var(--error);margin-left:2px}
    .fd-input{width:100%;height:36px;padding:0 12px;border:1px solid #89919a;border-radius:var(--radius);
              font-size:14px;font-family:inherit;color:var(--text);background:#fff;outline:none;
              transition:border-color .15s,box-shadow .15s}
    .fd-input:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,112,242,.15)}
    .fd-btn{width:100%;height:40px;background:var(--brand);color:#fff;border:none;border-radius:var(--radius);
            font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;
            justify-content:center;gap:8px;transition:background .15s}
    .fd-btn:hover{background:var(--brand-h)}
    .fd-msg-bar{background:var(--error-bg);border-left:3px solid var(--error);border-radius:var(--radius);
                padding:10px 14px;font-size:13px;color:var(--error);font-weight:600;margin-bottom:16px;
                display:flex;align-items:center;gap:8px}
    .fd-link{display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--brand);text-decoration:none}
    .fd-link:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="shell">
  <span class="shell-logo">&#9671; SoftCoM</span>
  <span class="shell-title">Restablecer contraseña</span>
</div>
<div class="main">
  <div class="fd-card">
    <div class="fd-card__header">
      <div class="hdr-icon">&#128274;</div>
      <div class="hdr-content">
        <h2>¿Olvidaste tu contraseña?</h2>
        <p>Te enviaremos un enlace para restablecerla</p>
      </div>
    </div>
    <div class="fd-card__body">
      {% if form.email.errors %}
      <div class="fd-msg-bar">&#9888; {{ form.email.errors|join:", " }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="fd-form-group">
          <label class="fd-label" for="id_email">Correo electrónico <span class="req">*</span></label>
          <input class="fd-input" type="email" id="id_email" name="email"
                 placeholder="usuario@empresa.com" autofocus required>
        </div>
        <button class="fd-btn" type="submit">&#128231; Enviar enlace de recuperación</button>
      </form>
      <a class="fd-link" href="/admin/login/">&#8592; Volver al login</a>
    </div>
    <div class="fd-card__footer">SoftCoM &mdash; Sistema de Gestión de Mantenimiento &middot; CCG</div>
  </div>
</div>
</body>
</html>
