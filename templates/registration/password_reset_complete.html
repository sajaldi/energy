<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contraseña restablecida — SoftCoM</title>
  <style>
    :root{--brand:#0070f2;--shell:#354a5e;--bg:#f5f6f7;--card:#fff;--border:#e5e5e5;
          --text:#32363a;--muted:#6a6d70;--success:#107e3e;--success-bg:#f1fff6;--radius:4px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Artifakt Element',"72",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    .shell{background:var(--shell);height:44px;display:flex;align-items:center;padding:0 16px}
    .shell-logo{font-size:16px;font-weight:700;color:#fff}
    .main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
    .fd-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
             box-shadow:0 2px 8px rgba(0,0,0,.08);width:100%;max-width:440px;text-align:center;overflow:hidden}
    .fd-card__top{background:var(--success-bg);border-bottom:3px solid var(--success);padding:36px 24px 28px}
    .fd-card__top .icon{font-size:52px;display:block;margin-bottom:14px}
    .fd-card__top h2{font-size:20px;font-weight:700;color:var(--success)}
    .fd-card__body{padding:24px}
    .fd-card__body p{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:8px}
    .fd-card__footer{padding:12px 24px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
    .fd-btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;
            border:none;border-radius:var(--radius);padding:11px 28px;font-size:14px;font-weight:700;
            font-family:inherit;cursor:pointer;text-decoration:none;margin-top:12px;transition:background .15s}
    .fd-btn:hover{background:#0064d9}
  </style>
</head>
<body>
<div class="shell"><span class="shell-logo">&#9671; SoftCoM</span></div>
<div class="main">
  <div class="fd-card">
    <div class="fd-card__top">
      <span class="icon">&#127881;</span>
      <h2>¡Contraseña restablecida!</h2>
    </div>
    <div class="fd-card__body">
      <p>Tu contraseña ha sido actualizada correctamente.</p>
      <p>Ya puedes iniciar sesión con tu nueva contraseña.</p>
      <a href="/admin/login/" class="fd-btn">&#10140; Iniciar sesión</a>
    </div>
    <div class="fd-card__footer">SoftCoM &mdash; Sistema de Gestión de Mantenimiento &middot; CCG</div>
  </div>
</div>
</body>
</html>
