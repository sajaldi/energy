{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Servidor - SoftCom CCG</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    {% include 'core/fiori_tokens.html' %}
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: var(--sap-font-family);
            background-color: var(--sap-bg-color);
            color: var(--sap-text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .error-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .error-card {
            max-width: 500px;
            width: 100%;
            text-align: center;
            padding: 3rem 2rem;
            border-top: 4px solid var(--sap-warning);
        }

        .error-icon {
            font-size: 80px;
            color: var(--sap-warning);
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--sap-text-color);
        }

        p {
            font-size: 16px;
            color: var(--sap-text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .sap-logo {
            font-weight: 800;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <header class="fiori-header">
        <div class="sap-logo">
            <ion-icon name="layers"></ion-icon>
            SoftCom CCG
        </div>
    </header>

    <main class="error-container">
        <div class="fiori-card error-card">
            <div class="error-icon">
                <ion-icon name="alert-circle-outline"></ion-icon>
            </div>
            <h1>Error Interno del Servidor</h1>
            <p>Algo salió mal de nuestro lado. Estamos trabajando para solucionarlo. Por favor, intenta de nuevo más tarde.</p>
            
            <div class="actions">
                <button onclick="location.reload()" class="fiori-btn fiori-btn-primary">
                    <ion-icon name="refresh-outline"></ion-icon>
                    Reintentar
                </a>
                <a href="/" class="fiori-btn fiori-btn-ghost">
                    <ion-icon name="home-outline"></ion-icon>
                    Ir al Inicio
                </a>
            </div>
        </div>
    </main>
</body>
</html>
