{% for node in nodes %}
<tr class="tree-row depth-{{ node.level }} {{ prefix }}-parent-{{ node.dom_parent_id }}" 
    data-id="{{ prefix }}-{{ node.dom_id }}" 
    data-parent="{{ prefix }}-{{ node.dom_parent_id }}"
    {% if node.children or node.loc_tree %}onclick="toggleTreeRow('{{ prefix }}-{{ node.dom_id }}')"{% endif %}
    style="{% if node.level > 0 %}display: none;{% endif %} cursor: pointer;">
    
    <td style="padding-left: {{ node.level|add:node.level|add:node.level }}0px;">
        <div style="display: flex; align-items: center; gap: 8px;">
            {% if node.children or node.loc_tree %}
                <i class="ph ph-caret-right tree-icon" id="icon-{{ prefix }}-{{ node.dom_id }}"></i>
            {% else %}
                <i class="ph ph-dot" style="opacity: 0.3;"></i>
            {% endif %}
            
            {% if node.is_depto %}
                <i class="ph ph-buildings" style="font-size: 0.9rem; color: #1a1f36;"></i>
            {% elif node.is_loc %}
                <i class="ph ph-map-pin" style="font-size: 0.8rem; color: #697386;"></i>
            {% else %}
                <i class="ph ph-warning-circle" style="font-size: 0.8rem; color: #0070b2;"></i>
            {% endif %}

            <span class="loc-name" style="font-weight: {% if node.children or node.loc_tree or node.is_depto %}700{% else %}400{% endif %}; color: {% if node.is_depto %}#1a1f36{% elif node.is_loc %}#4a4a4a{% else %}#1a1f36{% endif %}; text-transform: {% if node.is_depto %}uppercase{% else %}none{% endif %}; letter-spacing: {% if node.is_depto %}0.5px{% else %}normal{% endif %};">
                {{ node.nombre }}
            </span>
        </div>
    </td>
    <td style="text-align: center;">
        <span class="stat-pill total">{{ node.total }}</span>
    </td>
    <td style="text-align: center;">
        <span class="stat-pill open">{{ node.abiertos }}</span>
    </td>
    <td style="text-align: center;">
        <span class="stat-pill closed">{{ node.cerrados }}</span>
    </td>
    <td style="text-align: center;">
        <button class="btn btn-sm btn-light p-1" 
                onclick="event.stopPropagation(); showNodeTickets('{{ node.id }}', '{{ node.is_depto|yesno:'depto,' }}{{ node.is_falla|yesno:'falla,' }}{{ node.is_loc|yesno:'loc,' }}', '{{ node.nombre|escapejs }}')"
                title="Ver Tickets">
            <i class="ph ph-list-bullets" style="font-size: 1rem; color: #5469d4;"></i>
        </button>
    </td>
</tr>
{% endfor %}
