<div class="tree-node" style="margin-left: 20px;" data-id="{{ node.id }}">
    <div class="tree-item-row" style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
        <!-- Botón de expandir/contraer -->
        {% if node.subcategorias.all %}
        <button type="button" class="tree-toggle" data-target="children_cat_{{ node.id }}" style="background: none; border: none; cursor: pointer; padding: 2px; display: flex; align-items: center; color: #64748b; width: 20px; justify-content: center;">
            <i class="fas fa-chevron-right tree-icon"></i>
        </button>
        {% else %}
        <span style="width: 20px; display: inline-block;"></span>
        {% endif %}
        
        <!-- Checkbox de selección -->
        <label class="tree-label" style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin: 0; font-size: 0.9rem;">
            <input type="checkbox" name="categorias" value="{{ node.id }}" class="cat-checkbox"
                   {% if node.id|stringformat:"s" in selected_categorias %}checked{% endif %}>
            <span>
                <i class="fas fa-tag"></i>
                {{ node.nombre }}
            </span>
        </label>
        
        <!-- Botón de seleccionar todos los subniveles -->
        {% if node.subcategorias.all %}
        <button type="button" class="select-all-btn" data-type="categorias" data-parent-id="{{ node.id }}" style="background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px; padding: 2px 8px; font-size: 0.7rem; cursor: pointer; color: #64748b;">
            <i class="fas fa-check-double"></i> Todos
        </button>
        {% endif %}
    </div>
    
    <!-- Contenedor de Hijos (recursión) -->
    {% if node.subcategorias.all %}
    <div id="children_cat_{{ node.id }}" class="tree-children" style="display: none; border-left: 1px dashed #e2e8f0; margin-left: 9px; padding-left: 2px; padding-top: 4px;">
        {% for child in node.subcategorias.all %}
            {% with node=child %}
                {% include 'auditorias/partials/tree_categoria.html' %}
            {% endwith %}
        {% endfor %}
    </div>
    {% endif %}
</div>
