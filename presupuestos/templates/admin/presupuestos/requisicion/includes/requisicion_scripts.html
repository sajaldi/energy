<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    (function () {
        // Aseguramos que tenemos un símbolo $ válido
        const waitJQuery = setInterval(() => {
            if (typeof jQuery !== 'undefined' || typeof $ !== 'undefined') {
                clearInterval(waitJQuery);
                initWizard(jQuery || $);
            }
        }, 100);

        function initWizard($) {
            console.log('Iniciando Wizard JS...');

            // Inicializar Select2 con precaución
            try {
                if ($.fn.select2) {
                    $('.select2-material').select2({ width: '100%' });
                    console.log('Select2 inicializado');
                } else {
                    console.warn('Select2 no está disponible en $.fn');
                }
            } catch (e) {
                console.error('Error al inicializar Select2:', e);
            }

            // ========== CUSTOM PROVIDER SEARCH LOGIC ==========
            const providerSearch = {
                allProviders: [],
                selectedIds: [],

                init() {
                    console.log('Iniciando buscador de proveedores...');
                    this.cacheProviders();
                    this.bindEvents();
                    this.renderSelected();
                },

                cacheProviders() {
                    // Cargar proveedores desde el select oculto de Django
                    $('#provider-hidden-select select option').each((i, el) => {
                        const val = $(el).val();
                        if (val) {
                            // Usar .prop('innerHTML') o similar si .text() falla con encoding
                            const rawName = $(el).html();
                            // Decodificar entidades HTML si las hay
                            const decodedName = $('<div/>').html(rawName).text();

                            this.allProviders.push({
                                id: val,
                                name: decodedName || $(el).text()
                            });
                            if ($(el).is(':selected')) {
                                this.selectedIds.push(val);
                            }
                        }
                    });
                },

                bindEvents() {
                    const $input = $('#provider-search-input');
                    const $results = $('#provider-search-results');

                    $input.on('input', (e) => {
                        const query = e.target.value.toLowerCase().trim();
                        if (query.length < 2) {
                            $results.hide();
                            return;
                        }
                        this.showResults(query);
                    });

                    $input.on('focus', (e) => {
                        const query = e.target.value.toLowerCase().trim();
                        if (query.length >= 2) this.showResults(query);
                    });

                    $(document).on('click', (e) => {
                        if (!$(e.target).closest('.provider-search-wrapper').length) {
                            $results.hide();
                        }
                    });

                    $results.on('click', '.search-result-item', (e) => {
                        const id = $(e.currentTarget).data('id');
                        this.toggleProvider(id);
                        $input.val('');
                        $results.hide();
                    });

                    $('#selected-providers-list').on('click', '.remove-tag', (e) => {
                        const id = $(e.currentTarget).data('id').toString();
                        this.toggleProvider(id);
                    });
                },

                showResults(query) {
                    const $results = $('#provider-search-results');
                    const filtered = this.allProviders.filter(p => p.name.toLowerCase().includes(query));

                    if (filtered.length === 0) {
                        $results.html('<div class="search-result-item">No se encontraron resultados</div>').show();
                        return;
                    }

                    const html = filtered.map(p => `
                        <div class="search-result-item ${this.selectedIds.includes(p.id) ? 'selected' : ''}" data-id="${p.id}">
                            <span>${p.name}</span>
                            ${this.selectedIds.includes(p.id) ? '<span>✅</span>' : ''}
                        </div>
                    `).join('');

                    $results.html(html).show();
                },

                toggleProvider(id) {
                    const index = this.selectedIds.indexOf(id);
                    if (index === -1) {
                        this.selectedIds.push(id);
                    } else {
                        this.selectedIds.splice(index, 1);
                    }

                    this.syncWithHiddenSelect();
                    this.renderSelected();

                    // Actualizar agrupación en Paso 2 si estamos ahí
                    if (typeof refreshArticleGrouping === 'function') {
                        refreshArticleGrouping();
                    }
                },

                syncWithHiddenSelect() {
                    const $select = $('#provider-hidden-select select');
                    $select.val(this.selectedIds).trigger('change');
                },

                renderSelected() {
                    const $list = $('#selected-providers-list');
                    const $notesContainer = $('#notes-container');
                    
                    if (this.selectedIds.length === 0) {
                        $list.html('<small style="color:var(--text-muted); font-style:italic;">Ningún proveedor seleccionado</small>');
                        $notesContainer.slideUp();
                        return;
                    }

                    $notesContainer.slideDown();

                    const html = this.selectedIds.map(id => {
                        const p = this.allProviders.find(prov => prov.id === id);
                        if (!p) return '';
                        return `
                            <div class="provider-tag">
                                🏢 ${p.name}
                                <span class="remove-tag" data-id="${id}">✕</span>
                            </div>
                        `;
                    }).join('');

                    $list.html(html);
                }
            };
            providerSearch.init();

            // ========== ON-BEHALF USER SEARCH LOGIC ==========
            const onBehalfSearch = {
                allUsers: [],

                init() {
                    console.log('Iniciando buscador de usuarios (En nombre de)...');
                    this.cacheUsers();
                    this.bindEvents();

                    // Si ya hay un valor, mostrarlo en el input
                    const currentVal = $('#on-behalf-hidden-select select').val();
                    if (currentVal) {
                        const user = this.allUsers.find(u => u.id === currentVal);
                        if (user) $('#on-behalf-search-input').val(user.name);
                    }
                },

                cacheUsers() {
                    const $container = $('#on-behalf-hidden-select');
                    const $select = $container.find('select');

                    if ($select.length === 0) {
                        console.error('No se encontró el select de usuarios en #on-behalf-hidden-select');
                        return;
                    }

                    $select.find('option').each((i, el) => {
                        const val = $(el).val();
                        if (val) {
                            const rawName = $(el).html();
                            const decodedName = $('<div/>').html(rawName).text();
                            this.allUsers.push({
                                id: val,
                                name: (decodedName || $(el).text()).trim()
                            });
                        }
                    });
                    console.log(`Buscador de usuarios: ${this.allUsers.length} usuarios cargados.`);
                },

                bindEvents() {
                    const $input = $('#on-behalf-search-input');
                    const $results = $('#on-behalf-search-results');

                    $input.on('input', (e) => {
                        const query = e.target.value.toLowerCase().trim();
                        if (query.length < 2) {
                            $results.hide();
                            return;
                        }
                        this.showResults(query);
                    });

                    $input.on('focus', (e) => {
                        const query = e.target.value.toLowerCase().trim();
                        if (query.length >= 2) this.showResults(query);
                    });

                    $(document).on('click', (e) => {
                        if (!$(e.target).closest('.on-behalf-search-wrapper').length) {
                            $results.hide();
                        }
                    });

                    $results.on('click', '.search-result-item', (e) => {
                        const id = $(e.currentTarget).data('id').toString();
                        const name = $(e.currentTarget).find('span').first().text();

                        $input.val(name);
                        $('#on-behalf-hidden-select select').val(id).trigger('change');
                        $results.hide();
                    });
                },

                showResults(query) {
                    const $results = $('#on-behalf-search-results');
                    const filtered = this.allUsers.filter(u => u.name.toLowerCase().includes(query));

                    if (filtered.length === 0) {
                        $results.html('<div class="search-result-item">No se encontraron usuarios</div>').show();
                        return;
                    }

                    const html = filtered.map(u => `
                        <div class="search-result-item" data-id="${u.id}">
                            <span>👤 ${u.name}</span>
                        </div>
                    `).join('');

                    $results.html(html).show();
                }
            };
            onBehalfSearch.init();

            // ReadOnly Check
            const isReadOnly = "{{ is_readonly|yesno:'true,false' }}" === "true";
            const estadoRequisicion = "{{ instance.estado_requisicion|default:'' }}";

            if (isReadOnly) {
                console.log('Modo Solo Lectura Activado');
                // Deshabilitar todos los inputs
                $('#wizard-form :input').prop('disabled', true);

                // Ocultar botones de acción de guardado/edición
                $('.save-draft, #add-article, #add-document, .delete-row, .remove-new-row, #btn-finish, #btn-authorize').hide();

                // Habilitar botones de navegación (aunque los inputs estén disabled)
                $('.next-step, .prev-step').prop('disabled', false).show();

                // Re-habilitar solo el campo fecha probable de entrega
                $('#id_fecha_probable_entrega').prop('disabled', false).closest('.form-group').find('label, small').css('opacity', '1');

                // Auto-guardar fecha probable de entrega al cambiar
                $('#id_fecha_probable_entrega').on('change', function () {
                    const val = $(this).val();
                    if (!val) return;
                    fetch('{% url "presupuestos:api_update_requisicion_fecha_entrega" pk=instance.pk %}', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                        body: JSON.stringify({ fecha_probable_entrega: val })
                    })
                    .then(r => r.json())
                    .then(d => {
                        if (d.success) {
                            Swal.fire({ icon: 'success', title: 'Guardado', text: d.message, timer: 1500, showConfirmButton: false });
                        } else {
                            Swal.fire({ icon: 'error', title: 'Error', text: d.message });
                        }
                    })
                    .catch(e => Swal.fire({ icon: 'error', title: 'Error', text: 'Error de conexión: ' + e }));
                });

                // Mensaje informativo
            if ($('.alert-readonly').length === 0 && estadoRequisicion !== 'AUTORIZADO') {
                const msg = estadoRequisicion === 'PENDIENTE'
                    ? '🔒 Esta requisición fue enviada a aprobación y está bloqueada para edición.'
                    : '🔒 Esta requisición está bloqueada para edición.';
                $('.form-container').prepend(`<div class="alert-msg alert-error notify-readonly">${msg}</div>`);
            }
            }

            // Stepper click logic
            $('.step').on('click', function () {
                const step = $(this).data('step');
                if (!step) return;

                if (isReadOnly) {
                    console.log('Navegando (Solo Lectura) vía stepper al paso:', step);
                    const url = new URL(window.location.href);
                    url.searchParams.set('step', step);
                    window.location.href = url.toString();
                    return;
                }

                console.log('Stepper clic, navegando al paso:', step);
                $('#target_step').val(step);
                $('#wizard-form').submit();
            });

            // Registrar eventos de botones
            $('.next-step').on('click', function (e) {
                const nextStep = $(this).data('next');

                if (isReadOnly) {
                    // Navegación GET para modo lectura
                    e.preventDefault();
                    console.log('Navegando (Solo Lectura) al paso:', nextStep);
                    const url = new URL(window.location.href);
                    url.searchParams.set('step', nextStep);
                    window.location.href = url.toString();
                    return;
                }

                console.log('Navegando al paso:', nextStep);
                $('#target_step').val(nextStep);
                $('#wizard-form').submit();
            });

            $('.prev-step').on('click', function () {
                const prevStep = $(this).data('prev');
                console.log('Regresando al paso:', prevStep);
                if (isReadOnly) {
                    const pk = "{{ instance.pk|default:'' }}";
                    if (pk) {
                        const urlTemplate = "{% url 'presupuestos:requisicion_editar' pk='00000000-0000-0000-0000-000000000000' %}";
                        window.location.href = urlTemplate.replace('00000000-0000-0000-0000-000000000000', pk) + "?step=" + prevStep;
                    }
                    return;
                }
                $('#target_step').val(prevStep);
                $('#wizard-form').submit();
            });

            $('#btn-finish').on('click', function () {
                if (isReadOnly) return;
                const pk = "{{ instance.pk|default:'' }}";

                // Si hay PK y está en borrador, guardar y luego solicitar autorización
                if (pk) {
                    Swal.fire({
                        title: '¿Enviar Solicitud de Aprobación?',
                        text: 'Se guardará la requisición y se enviará al flujo de aprobación.',
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonText: '🚀 Sí, enviar',
                        cancelButtonText: 'Cancelar'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // Primero guardar
                            Swal.fire({ title: 'Guardando y enviando...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                            $('#final_save').val('true');
                            
                            // Submit via AJAX para poder encadenar la autorización
                            const formData = new FormData($('#wizard-form')[0]);
                            $.ajax({
                                url: $('#wizard-form').attr('action') || window.location.href,
                                type: 'POST',
                                data: formData,
                                processData: false,
                                contentType: false,
                                success: function () {
                                    // Ahora solicitar autorización
                                    const urlTemplate = "{% url 'presupuestos:requisicion_autorizar' pk='00000000-0000-0000-0000-000000000000' %}";
                                    const url = urlTemplate.replace('00000000-0000-0000-0000-000000000000', pk);

                                    $.ajax({
                                        url: url,
                                        type: 'POST',
                                        data: { 'csrfmiddlewaretoken': $('[name=csrfmiddlewaretoken]').val() },
                                        success: function (response) {
                                            Swal.fire('¡Enviado!', response.message || 'Autorización solicitada exitosamente.', 'success').then(() => {
                                                location.reload();
                                            });
                                        },
                                        error: function (xhr) {
                                            Swal.fire('Error', xhr.responseJSON ? xhr.responseJSON.message : 'Error al conectar con Power Automate', 'error');
                                        }
                                    });
                                },
                                error: function () {
                                    Swal.fire('Error', 'Error al guardar la requisición.', 'error');
                                }
                            });
                        }
                    });
                } else {
                    // Sin PK, solo guardar normal
                    $('#final_save').val('true');
                    $('#wizard-form').submit();
                }
            });

            $('.save-draft').on('click', function () {
                if (isReadOnly) return;
                console.log('Guardando borrador');
                $('#final_save').val('true');
                $('#wizard-form').submit();
            });

            // Lógica de Agrupación de Artículos por Proveedor
            function refreshArticleGrouping() {
                const step2Card = $('#card-step-2');
                if (!step2Card.length) return;

                console.log('Refrescando agrupación por proveedor...');

                // 1. Obtener proveedores seleccionados
                const selectedProviders = providerSearch.selectedIds;
                const providerNames = {};

                providerSearch.allProviders.forEach(p => {
                    if (selectedProviders.includes(p.id)) {
                        providerNames[p.id] = p.name;
                    }
                });

                // 2. Asegurarnos que existan los contenedores por proveedor
                let container = $('#articles-container');
                if (!container.length) return;

                // Limpiar headers viejos si los hubiera (solo los headers internos de agrupación)
                container.find('.provider-group-wrapper').each(function () {
                    // Mover los hijos de vuelta al contenedor principal antes de borrar
                    $(this).find('.article-row').appendTo(container);
                    $(this).remove();
                });

                // Crear secciones para cada proveedor seleccionado
                selectedProviders.forEach(id => {
                    let section = $(`<div class="provider-group-wrapper" data-group-id="${id}">
                        <div class="provider-header">
                            <span>🏢 Proveedor: ${providerNames[id]}</span>
                            <button type="button" class="btn-custom btn-primary-custom add-to-provider" data-provider-id="${id}" style="padding: 4px 10px; font-size: 0.7rem;">+ Agregar aquí</button>
                        </div>
                        <div class="items-container" id="group-container-${id}"></div>
                    </div>`);
                    container.append(section);
                });

                // Sección "Otros / Sin Asignar"
                let othersSection = $(`<div class="provider-group-wrapper" data-group-id="others">
                    <div class="provider-header" style="background: #f8fafc; border-left-color: #94a3b8; color: #64748b;">
                        <span>❓ Otros / Sin Proveedor</span>
                    </div>
                    <div class="items-container" id="group-container-others"></div>
                </div>`);
                container.append(othersSection);

                // 3. Mover filas a sus contenedores
                container.find('> .article-row').each(function () {
                    const row = $(this);
                    // Buscar el valor del select de proveedor dentro de la fila
                    const provSelect = row.find('select[name$="-proveedor"]');
                    const currentVal = provSelect.val();

                    if (currentVal && selectedProviders.includes(currentVal)) {
                        row.appendTo($(`#group-container-${currentVal}`));
                    } else {
                        row.appendTo($('#group-container-others'));
                    }
                });

                console.log('Agrupación completada.');
            }

            // Delegación de eventos para el botón "Agregar aquí" de cada proveedor
            $(document).on('click', '.add-to-provider', function () {
                const providerId = $(this).data('provider-id');
                materialModal.open(providerId);
            });

            // Re-agrupar cuando cambie el proveedor en una fila
            $(document).on('change', 'select[name$="-proveedor"]', function () {
                // Pequeño delay para no interrumpir la interacción
                setTimeout(refreshArticleGrouping, 100);
            });

            // Lógica de Formsets
            function addRow(prefix, containerId, emptyRowId) {
                const totalForms = $(`#id_${prefix}-TOTAL_FORMS`);
                const count = parseInt(totalForms.val());
                const newRowHtml = $(`#${emptyRowId}`).html().replace(/__prefix__/g, count);
                const newRow = $(newRowHtml);
                $(`#${containerId}`).append(newRow);
                totalForms.val(count + 1);

                if (prefix === 'articulos') {
                    try {
                        if ($.fn.select2) newRow.find('.select2-material').select2({ width: '100%' });
                    } catch (e) { }
                    refreshArticleGrouping();
                }
                return newRow;
            }

            // Agregar fila vacía solo si no hay artículos existentes
            $(document).ready(function () {
                const totalArticulos = parseInt($('#id_articulos-TOTAL_FORMS').val()) || 0;
                if (totalArticulos === 0) {
                    addRow('articulos', 'articles-container', 'empty-article-row');
                } else {
                    refreshArticleGrouping();
                }
            });

            $('#add-article').on('click', () => addRow('articulos', 'articles-container', 'empty-article-row'));
            $('#add-document').on('click', () => addRow('documentos', 'document-formset', 'empty-document-row'));
            $(document).on('click', '.remove-new-row', function () {
                const row = $(this).closest('.article-row');
                row.remove();
                refreshArticleGrouping();
            });
            $(document).on('click', '.delete-row', function () {
                const row = $(this).closest('.formset-row');
                const deleteCheckbox = row.find('input[type="checkbox"][name$="-DELETE"]');
                if (deleteCheckbox.length) {
                    deleteCheckbox.prop('checked', true);
                    row.hide();
                    refreshArticleGrouping();
                }
            });

            // Toggle "En nombre de"
            $('#toggle-behalf').on('click', function () {
                const container = $('#on-behalf-container');
                if (container.is(':visible')) {
                    container.slideUp();
                } else {
                    container.slideDown();
                }
            });

            // Botón Solicitar Autorización
            $('#btn-authorize').on('click', function () {
                const pk = "{{ instance.pk|default:'' }}";
                if (!pk) return;

                Swal.fire({
                    title: '¿Solicitar Autorización?',
                    text: 'Esto enviará la requisición al flujo de aprobación.',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: '🚀 Sí, solicitar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        Swal.fire({ title: 'Enviando...', didOpen: () => Swal.showLoading() });

                        const urlTemplate = "{% url 'presupuestos:requisicion_autorizar' pk='00000000-0000-0000-0000-000000000000' %}";
                        const url = urlTemplate.replace('00000000-0000-0000-0000-000000000000', pk);

                        $.ajax({
                            url: url,
                            type: 'POST',
                            data: {
                                'csrfmiddlewaretoken': $('[name=csrfmiddlewaretoken]').val()
                            },
                            success: function (response) {
                                Swal.fire('¡Enviado!', response.message, 'success').then(() => {
                                    location.reload();
                                });
                            },
                            error: function (xhr) {
                                Swal.fire('Error', xhr.responseJSON ? xhr.responseJSON.message : 'Error al conectar con Power Automate', 'error');
                            }
                        });
                    }
                });
            });

            // ========== MATERIAL SELECTOR MODAL ==========
            const materialModal = {
                currentPage: 1,
                currentCategory: '',
                searchQuery: '',
                targetProvider: '', // ID del proveedor al que se agregarán los items

                init() {
                    this.loadCategories();
                    this.bindEvents();
                },

                bindEvents() {
                    $('#open-material-selector').on('click', () => this.open());
                    $('#close-modal').on('click', () => this.close());
                    $('.modal-overlay').on('click', (e) => {
                        if (e.target.id === 'material-modal') this.close();
                    });

                    $('#material-search').on('input', (e) => {
                        this.searchQuery = e.target.value;
                        this.currentPage = 1;
                        this.loadMaterials();
                    });

                    // New Material Form Events
                    $('#btn-show-new-mat-form').on('click', (e) => {
                        e.preventDefault();
                        this.toggleNewMaterialForm(true);
                    });

                    $('#cancel-new-mat').on('click', () => {
                        this.toggleNewMaterialForm(false);
                    });

                    $('#add-new-mat-btn').on('click', () => {
                        this.addNewMaterial();
                    });

                    // Event delegation for category tree
                    $(document).on('click', '.category-row', (e) => {
                        e.stopPropagation();
                        if ($(e.target).hasClass('cat-caret')) return;

                        $('.category-row').removeClass('active');
                        $('.category-label').removeClass('active');

                        const row = $(e.currentTarget);
                        const label = row.find('.category-label');

                        label.addClass('active');

                        this.currentCategory = label.data('category');
                        this.currentPage = 1;
                        this.toggleNewMaterialForm(false);
                        this.loadMaterials();
                    });

                    $(document).on('click', '.cat-caret', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        const caret = $(e.currentTarget);
                        const subtree = caret.closest('.tree-node').children('.subtree');
                        subtree.slideToggle(200);
                        caret.toggleClass('collapsed');
                    });

                    $(document).on('click', '.material-card', (e) => {
                        if ($(e.target).is('button, input')) return;
                        const card = $(e.currentTarget);
                        
                        const wasSelected = card.hasClass('selected');
                        $('.material-card').removeClass('selected');
                        if (!wasSelected) {
                            card.addClass('selected');
                            card.find('.quantity-input').focus();
                        }
                    });

                    $(document).on('click', '.qty-btn', (e) => {
                        e.stopPropagation();
                        const input = $(e.target).siblings('.quantity-input');
                        const current = parseFloat(input.val()) || 1;
                        const change = $(e.target).data('change');
                        const newVal = Math.max(0.01, current + change);
                        input.val(newVal.toFixed(2));
                    });

                    $(document).on('click', '.add-to-cart-btn', (e) => {
                        e.stopPropagation();
                        const card = $(e.target).closest('.material-card');
                        const quantity = card.find('.quantity-input').val();

                        this.addToFormset({
                            id: card.data('id'),
                            nombre: card.data('nombre'),
                            sku: card.data('sku'),
                            precio: card.data('precio')
                        }, quantity, '');

                        card.removeClass('selected');
                        card.css('background', 'rgba(16, 185, 129, 0.2)');
                        setTimeout(() => card.css('background', ''), 500);
                    });

                    $('#prev-page').on('click', () => {
                        if (this.currentPage > 1) {
                            this.currentPage--;
                            this.loadMaterials();
                        }
                    });

                    $('#next-page').on('click', () => {
                        this.currentPage++;
                        this.loadMaterials();
                    });
                },

                open(providerId) {
                    this.targetProvider = providerId || '';
                    $('#material-modal').addClass('active');

                    // Actualizar título o subtítulo si hay proveedor
                    const $title = $('#material-modal .modal-title');
                    if (this.targetProvider) {
                        const providerName = $(`[name="proveedores_sugeridos"] option[value="${this.targetProvider}"]`).text() || 'Proveedor';
                        $title.html(`🛒 Selección para: <span style="color:var(--primary);">${providerName}</span>`);
                    } else {
                        $title.text('🛒 Seleccionar Materiales');
                    }

                    this.loadMaterials();
                },

                close() {
                    $('#material-modal').removeClass('active');
                },

                toggleNewMaterialForm(show) {
                    if (show) {
                        $('#materials-grid').hide();
                        $('#pagination-controls').hide();
                        $('#new-material-form').show();
                        $('#btn-show-new-mat-form').hide();
                        $('#new-mat-name').focus();
                    } else {
                        $('#new-material-form').hide();
                        $('#materials-grid').show();
                        if (this.currentPage > 0) $('#pagination-controls').show();
                        $('#btn-show-new-mat-form').show();
                    }
                },

                addNewMaterial() {
                    const name = $('#new-mat-name').val();
                    const qty = $('#new-mat-qty').val();
                    const price = $('#new-mat-price').val();
                    const desc = $('#new-mat-desc').val();

                    if (!name) {
                        Swal.fire({ title: 'Error', text: 'Debe ingresar un nombre para el material.', icon: 'error', confirmButtonColor: '#EF4444' });
                        return;
                    }
                    if (!qty || parseFloat(qty) <= 0) {
                        Swal.fire({ title: 'Error', text: 'La cantidad debe ser mayor a 0.', icon: 'error', confirmButtonColor: '#EF4444' });
                        return;
                    }

                    const manualMaterial = {
                        id: '',
                        nombre: name,
                        sku: 'SOLICITUD',
                        precio: price || 0
                    };

                    const fullDesc = `[NUEVO] ${name}` + (desc ? ` - ${desc}` : '');
                    this.addToFormset(manualMaterial, qty, fullDesc);

                    $('#new-mat-name').val('');
                    $('#new-mat-desc').val('');
                    $('#new-mat-qty').val('1');
                    $('#new-mat-price').val('0');

                    this.toggleNewMaterialForm(false);

                    Swal.fire({
                        title: '¡Solicitud Agregada!',
                        text: 'Se ha agregado el nuevo material a la lista.',
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false
                    });
                },

                loadCategories() {
                    $.get('/inventarios/api/categories/', (data) => {
                        const list = $('#category-tree-root');
                        list.empty();
                        list.append(`
                            <li class="tree-node">
                                <div class="category-row all-categories active">
                                    <span class="cat-spacer"></span>
                                    <span class="category-label" data-category="">Todas</span>
                                </div>
                            </li>
                        `);

                        function buildTreeHtml(nodes) {
                            if (!nodes || nodes.length === 0) return '';
                            let html = '';
                            nodes.forEach(node => {
                                const hasChildren = node.children && node.children.length > 0;
                                html += `<li class="tree-node">`;
                                html += `<div class="category-row">`;
                                if (hasChildren) {
                                    html += `<span class="cat-caret">▼</span>`;
                                } else {
                                    html += `<span class="cat-spacer"></span>`;
                                }
                                html += `<span class="category-label" data-category="${node.id}">${node.nombre}</span>`;
                                html += `</div>`;
                                if (hasChildren) {
                                    html += `<ul class="subtree" style="display:none;">`;
                                    html += buildTreeHtml(node.children);
                                    html += `</ul>`;
                                }
                                html += `</li>`;
                            });
                            return html;
                        }
                        list.append(buildTreeHtml(data.results));
                    });
                },

                loadMaterials() {
                    const params = {
                        page: this.currentPage,
                        q: this.searchQuery,
                        category: this.currentCategory
                    };

                    $.get('/inventarios/api/materials/', params, (data) => {
                        const grid = $('#materials-grid');
                        grid.empty();

                        if (data.results.length === 0) {
                            grid.html('<p style="text-align: center; color: var(--text-muted); padding: 40px;">No se encontraron materiales.</p>');
                            $('#pagination-controls').hide();
                            return;
                        }

                        data.results.forEach(material => {
                            grid.append(`
                                <div class="material-card" 
                                     data-id="${material.id}" 
                                     data-nombre="${material.nombre}"
                                     data-sku="${material.sku}"
                                     data-precio="${material.precio_estimado}"
                                     data-allowed="true">
                                    <img src="${material.image_url}" class="material-image" alt="${material.nombre}">
                                    <div class="material-name">
                                        ${material.nombre}
                                        <div style="display:flex; gap:10px; margin-top:2px;">
                                            <span class="material-sku">SKU: ${material.sku}</span>
                                            <span class="material-stock">Stock: ${material.stock} ${material.unidad}</span>
                                        </div>
                                    </div>
                                    <div class="quantity-controls">
                                        <button class="qty-btn" data-change="-1" type="button">−</button>
                                        <input type="number" class="quantity-input" value="1" min="0.01" step="0.01">
                                        <button class="qty-btn" data-change="1" type="button">+</button>
                                        <button class="add-to-cart-btn" type="button">✓ Agregar</button>
                                    </div>
                                </div>
                            `);
                        });

                        if (data.num_pages > 1) {
                            $('#pagination-controls').show();
                            $('#page-info').text(`Página ${data.current_page} de ${data.num_pages}`);
                            $('#prev-page').prop('disabled', data.current_page === 1);
                            $('#next-page').prop('disabled', !data.has_next);
                        } else {
                            $('#pagination-controls').hide();
                        }
                    });
                },

                addToFormset(material, quantity, description) {
                    if (material.id) {
                        let existingRowIndex = -1;
                        const totalForms = parseInt($('#id_articulos-TOTAL_FORMS').val());

                        for (let i = 0; i < totalForms; i++) {
                            const row = $(`#article-${i}`);
                            if (row.length && row.is(':visible')) {
                                const rowMaterialVal = $(`#id_articulos-${i}-material`).val();
                                if (rowMaterialVal == material.id) {
                                    existingRowIndex = i;
                                    break;
                                }
                            }
                        }

                        if (existingRowIndex !== -1) {
                            Swal.fire({
                                title: '¡Material ya agregado!',
                                text: `El material "${material.nombre}" ya está en tu lista. ¿Quieres sumar la cantidad ingresada a la existente?`,
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonColor: '#10b981',
                                cancelButtonColor: '#64748b',
                                confirmButtonText: '➕ Sumar Cantidad',
                                cancelButtonText: 'Cancelar'
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    const qtyInput = $(`#id_articulos-${existingRowIndex}-cr8ca_cantidad`);
                                    const currentQty = parseFloat(qtyInput.val()) || 0;
                                    const addQty = parseFloat(quantity) || 0;
                                    const newTotal = currentQty + addQty;
                                    qtyInput.val(newTotal.toFixed(2));

                                    const row = $(`#article-${existingRowIndex}`);
                                    const originalBg = row.css('background-color');
                                    row.css('background-color', '#dcfce7');
                                    row.css('transition', 'background-color 0.5s');
                                    setTimeout(() => row.css('background-color', originalBg || ''), 1500);

                                    Swal.fire({ title: '¡Cantidad Actualizada!', text: `Total acumulado: ${newTotal.toFixed(2)}`, icon: 'success', timer: 1500, showConfirmButton: false });
                                }
                            });
                            return;
                        }
                    }
                    this._itemAddLogic(material, quantity, description);
                },

                _itemAddLogic(material, quantity, description) {
                    const totalForms = $('#id_articulos-TOTAL_FORMS');
                    const count = parseInt(totalForms.val());
                    const newRow = $('#empty-article-row').html().replace(/__prefix__/g, count);
                    $('#articles-container').append(newRow);

                    if (material.id) {
                        $(`#id_articulos-${count}-material`).val(material.id).trigger('change');
                    } else {
                        $(`#id_articulos-${count}-material`).val(null).trigger('change');
                    }

                    // Asignar proveedor activo si existe
                    if (this.targetProvider) {
                        $(`#id_articulos-${count}-proveedor`).val(this.targetProvider).trigger('change');
                    }

                    $(`#id_articulos-${count}-cr8ca_articulo`).val(description || material.nombre);
                    $(`#id_articulos-${count}-cr8ca_cantidad`).val(quantity);
                    $(`#id_articulos-${count}-cr8ca_costoaproximado`).val(material.precio);

                    try {
                        if ($.fn.select2) $(`#id_articulos-${count}-material`).select2({ width: '100%' });
                    } catch (e) { }

                    totalForms.val(count + 1);
                    refreshArticleGrouping();
                }
            };
            materialModal.init();

            // ========== DOCUMENT PREVIEW MODAL ==========
            const documentModal = {
                init() { this.bindEvents(); },
                bindEvents() {
                    $(document).on('click', '.document-preview-item', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const url = $(this).data('url');
                        const name = $(this).data('name');
                        console.log('Document preview click:', url, name);
                        if (url) {
                            documentModal.open(url, name);
                        }
                    });
                    $(document).on('click', '#close-document-modal', () => documentModal.close());
                    $(document).on('click', '#document-modal', (e) => { if (e.target.id === 'document-modal') documentModal.close(); });
                    $(document).on('keydown', (e) => { if (e.key === 'Escape') documentModal.close(); });
                },
                open(url, name) {
                    $('#document-modal-title').text(`📄 ${name}`);
                    $('#document-iframe').attr('src', url);
                    const downloadUrl = url + (url.includes('?') ? '&' : '?') + 'download=1';
                    $('#document-download-btn').attr('href', downloadUrl).attr('download', name || '');
                    $('#document-modal').fadeIn(200);
                },
                close() {
                    $('#document-modal').fadeOut(200);
                    setTimeout(() => $('#document-iframe').attr('src', ''), 300);
                }
            };
            documentModal.init();

            // ========== UNLOCK EDIT BUTTON ==========
            {% if instance and can_unlock %}
            document.getElementById('btn-unlock-edit').addEventListener('click', function () {
                Swal.fire({
                    title: '⚠️ ¿Desbloquear esta requisición?',
                    html: '<p style="text-align: left; padding: 0 20px;">Si desbloquea esta requisición para editarla, <strong>volverá al estado de Borrador</strong> y deberá:<br><br>' +
                        '✓ Realizar los cambios necesarios<br>' +
                        '✓ Guardar la requisición<br>' +
                        '✓ <strong>Solicitar nuevamente la autorización</strong><br><br>' +
                        '¿Está de acuerdo en continuar?</p>',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ff9800',
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: 'Sí, Desbloquear',
                    cancelButtonText: 'Cancelar',
                    reverseButtons: true,
                    width: '600px'
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = "{% url 'presupuestos:requisicion_unlock_edit' pk=instance.pk %}";
                    }
                });
            });
            {% endif %}

            // ========== READONLY MODE: Disable all inputs ==========
            {% if is_readonly %}
            (function () {
                const formInputs = document.querySelectorAll('#wizard-form input, #wizard-form select, #wizard-form textarea, #wizard-form button[type="submit"]');
                formInputs.forEach(el => el.disabled = true);

                const actionButtons = document.querySelectorAll('.save-draft, #add-article, #add-document');
                actionButtons.forEach(el => {
                    el.style.opacity = '0.5';
                    el.style.cursor = 'not-allowed';
                    el.style.pointerEvents = 'none';
                });

                // Keep navigation and document preview working
                document.querySelectorAll('.next-step, .prev-step').forEach(el => {
                    el.disabled = false;
                    el.style.pointerEvents = 'auto';
                });
                
                // Ensure document preview items remain clickable
                document.querySelectorAll('.document-preview-item').forEach(el => {
                    el.style.pointerEvents = 'auto';
                    el.style.cursor = 'pointer';
                });
                document.querySelectorAll('.doc-download-link').forEach(el => {
                    el.style.pointerEvents = 'auto';
                });

                // Re-habilitar solo el campo fecha probable de entrega
                const fpe = document.getElementById('id_fecha_probable_entrega');
                if (fpe) {
                    fpe.disabled = false;
                    fpe.addEventListener('change', function () {
                        const val = this.value;
                        if (!val) return;
                        fetch('{% url "presupuestos:api_update_requisicion_fecha_entrega" pk=instance.pk %}', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                            body: JSON.stringify({ fecha_probable_entrega: val })
                        })
                        .then(r => r.json())
                        .then(d => {
                            if (d.success) {
                                Swal.fire({ icon: 'success', title: 'Guardado', text: d.message, timer: 1500, showConfirmButton: false });
                            } else {
                                Swal.fire({ icon: 'error', title: 'Error', text: d.message });
                            }
                        })
                        .catch(e => Swal.fire({ icon: 'error', title: 'Error', text: 'Error de conexión: ' + e }));
                    });
                }
            })();
            {% endif %}

            // ========== CALCULATE ROW TOTALS, SUBTOTAL, GRAND TOTAL ==========
            function recalcTotals() {
                let subtotal = 0;
                $('#articles-container .article-row').each(function () {
                    const $row = $(this);
                    if ($row.is(':hidden')) return;
                    const qty = parseFloat($row.find('[name$="-cr8ca_cantidad"]').val()) || 0;
                    const cost = parseFloat($row.find('[name$="-cr8ca_costoaproximado"]').val()) || 0;
                    const total = qty * cost;
                    $row.find('.row-total').text(total.toFixed(2));
                    subtotal += total;
                });
                $('#subtotal').text('L. ' + subtotal.toFixed(2));

                const isv = parseFloat($('#id_isv').val()) || 0;
                $('#isv-display').text('L. ' + isv.toFixed(2));

                const grandTotal = subtotal + isv;
                $('#grand-total').text('L. ' + grandTotal.toFixed(2));
            }

            $(document).on('input', '[name$="-cr8ca_cantidad"], [name$="-cr8ca_costoaproximado"]', recalcTotals);
            $(document).on('input', '#id_isv', recalcTotals);
            $(document).on('click', '.delete-row, .remove-new-row', function () {
                setTimeout(recalcTotals, 50);
            });

            // Observer for dynamically added rows
            const articlesContainer = document.getElementById('articles-container');
            if (articlesContainer) {
                const observer = new MutationObserver(() => setTimeout(recalcTotals, 50));
                observer.observe(articlesContainer, { childList: true, subtree: false });
            }

            recalcTotals();

            console.log('Eventos del Wizard registrados correctamente');

            // ═══════════════════════════════════════════════════
            // PAQUETES DE MATERIALES
            // ═══════════════════════════════════════════════════
            const USER_DEPT_ID = {{ request.user.perfil.departamento_id|default:'null' }};

            $('#btn-cargar-paquete').on('click', function() {
                if (!USER_DEPT_ID) {
                    Swal.fire({ icon: 'warning', title: 'Sin departamento',
                        text: 'No tienes un departamento asignado en tu perfil.' });
                    return;
                }

                // Fetch packages for this department
                fetch('/presupuestos/api/paquetes/por-departamento/?departamento=' + USER_DEPT_ID)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.paquetes || data.paquetes.length === 0) {
                            Swal.fire({ icon: 'info', title: 'Sin paquetes',
                                text: 'No hay paquetes de materiales para tu departamento.' });
                            return;
                        }

                        const buttons = data.paquetes.map(p =>
                            `<button class="swal-paq-btn" data-id="${p.id}"
                                style="display:block;width:100%;padding:10px 14px;margin-bottom:6px;
                                border:1px solid #d1d5db;border-radius:6px;background:#fff;
                                cursor:pointer;text-align:left;font-size:0.9rem;
                                transition:all 0.15s;"
                                onmouseover="this.style.borderColor='#3b82f6';this.style.background='#eff6ff'"
                                onmouseout="this.style.borderColor='#d1d5db';this.style.background='#fff'">
                                <strong>📦 ${p.nombre}</strong>
                                ${p.descripcion ? '<br><span style="font-size:0.78rem;color:#64748b;">' + p.descripcion + '</span>' : ''}
                            </button>`
                        ).join('');

                        Swal.fire({
                            title: 'Seleccionar Paquete',
                            html: `<div style="max-height:400px;overflow-y:auto;">${buttons}</div>`,
                            showConfirmButton: false,
                            showCancelButton: true,
                            cancelButtonText: 'Cancelar',
                            didOpen: () => {
                                document.querySelectorAll('.swal-paq-btn').forEach(btn => {
                                    btn.addEventListener('click', function() {
                                        const paqId = this.dataset.id;
                                        Swal.close();
                                        cargarPaquete(paqId);
                                    });
                                });
                            }
                        });
                    });
            });

            function cargarPaquete(paqId) {
                Swal.fire({ title: 'Cargando...', allowOutsideClick: false,
                    didOpen: () => Swal.showLoading() });

                fetch('/presupuestos/api/paquetes/' + paqId + '/items/')
                    .then(r => r.json())
                    .then(data => {
                        Swal.close();
                        if (!data.items || data.items.length === 0) {
                            Swal.fire({ icon: 'info', title: 'Paquete vacío',
                                text: 'Este paquete no tiene items.' });
                            return;
                        }

                        let added = 0;
                        data.items.forEach(item => {
                            const materialData = item.material_id ? {
                                id: item.material_id,
                                nombre: item.material_nombre || item.descripcion,
                                sku: item.material_sku || '',
                                precio_estimado: item.costo_aproximado || 0,
                            } : {
                                id: '',
                                nombre: item.descripcion || 'Item',
                                sku: 'SOLICITUD',
                                precio_estimado: item.costo_aproximado || 0,
                            };

                            // Check if this material already exists in formset
                            let existingIndex = -1;
                            let existingQty = 0;
                            const prefix = 'articulos';
                            const totalForms = parseInt($('#id_' + prefix + '-TOTAL_FORMS').val()) || 0;

                            for (let i = 0; i < totalForms; i++) {
                                const matVal = $('#id_' + prefix + '-' + i + '-material').val();
                                if (matVal && matVal == materialData.id) {
                                    existingIndex = i;
                                    existingQty = parseFloat($('#id_' + prefix + '-' + i + '-cr8ca_cantidad').val()) || 0;
                                    break;
                                }
                            }

                            const desc = item.descripcion || materialData.nombre;
                            const qty = item.cantidad || 1;
                            const price = item.costo_aproximado || materialData.precio_estimado || 0;

                            if (existingIndex >= 0) {
                                // Sum quantities
                                const newQty = existingQty + qty;
                                $('#id_' + prefix + '-' + existingIndex + '-cr8ca_cantidad').val(newQty);
                                // Trigger change event for recalculation
                                $('#id_' + prefix + '-' + existingIndex + '-cr8ca_cantidad').trigger('change');
                            } else {
                                // Add new row
                                const newIndex = totalForms;
                                const newRowHtml = $('#empty-article-row').html().replace(/__prefix__/g, newIndex);
                                const $newRow = $(newRowHtml);
                                $('#articles-container').append($newRow);

                                // Set values
                                $('#id_' + prefix + '-' + newIndex + '-material').val(materialData.id);
                                $('#id_' + prefix + '-' + newIndex + '-cr8ca_articulo').val(desc);
                                $('#id_' + prefix + '-' + newIndex + '-cr8ca_cantidad').val(qty);
                                $('#id_' + prefix + '-' + newIndex + '-cr8ca_costoaproximado').val(price);

                                // Update TOTAL_FORMS
                                $('#id_' + prefix + '-TOTAL_FORMS').val(newIndex + 1);
                            }
                            added++;
                        });

                        // Recalculate totals and regroup
                        if (typeof refreshArticleGrouping === 'function') {
                            refreshArticleGrouping();
                        }
                        recalcTotals();

                        Swal.fire({
                            icon: 'success',
                            title: 'Paquete cargado',
                            text: added + ' item(s) agregados al formulario.',
                            timer: 2000,
                            showConfirmButton: false,
                        });
                    })
                    .catch(() => {
                        Swal.close();
                        Swal.fire({ icon: 'error', title: 'Error', text: 'No se pudo cargar el paquete.' });
                    });
            }
        }
    })();
</script>
