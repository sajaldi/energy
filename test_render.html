        z-index: 1000;

        </a>

    <div id="toast">Actualizando...</div>

    <script>
        async function updateOT() {
            const form = document.getElementById('assignmentForm');
            const formData = new FormData(form);
            const toast = document.getElementById('toast');
            
            toast.textContent = "Actualizando...";
            toast.classList.add('show');

            try {
                const response = await fetch("/mantenimiento/app/ot/20961/update-ajax/", {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                    }
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    toast.textContent = "¡Guardado!";
                    setTimeout(() => toast.classList.remove('show'), 2000);
                } else {
                    alert("Error: " + result.message);
                    toast.classList.remove('show');
                }
            } catch (error) {
                console.error("Error updating OT:", error);
                alert("Error de conexión al guardar cambios.");
                toast.classList.remove('show');
            }
        }
    </script>
