# ==========================================================
# CONFIGURACIÓN MINIO (PUERTO 9000 - API)
# ==========================================================
Listen 9000
<VirtualHost *:9000>
    ServerName 181.115.47.107
    DocumentRoot "C:/Apache24/htdocs"
    
    # Módulos necesarios
    LoadModule proxy_module modules/mod_proxy.so
    LoadModule proxy_http_module modules/mod_proxy_http.so
    LoadModule headers_module modules/mod_headers.so	

    # Configuración básica	
    ProxyRequests Off
    ProxyPreserveHost On
    
    # Proxy directo a la IP interna para preservar Host y evitar Signature Mismatch
    ProxyPass / http://10.30.1.11:9000/
    ProxyPassReverse / http://10.30.1.11:9000/
    
    AllowEncodedSlashes NoDecode
    ErrorLog "logs/minio_api_error.log"
    LogLevel debug
</VirtualHost>

# ==========================================================
# CONFIGURACIÓN MINIO (PUERTO 9001 - CONSOLE)
# ==========================================================
Listen 9001
<VirtualHost *:9001>
    ServerName 181.115.47.107
    DocumentRoot "C:/Apache24/htdocs"

    # Módulos necesarios
    <IfModule !proxy_wstunnel_module>
        LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
    </IfModule>

    ProxyRequests Off
    ProxyPreserveHost On

    # Soporte para WebSockets de MinIO (Crítico para que el Console no se quede en "Loading")
    # Intentamos primero el túnel de WebSockets para la ruta /ws/
    ProxyPass /ws/ ws://10.30.1.11:9001/ws/
    ProxyPassReverse /ws/ ws://10.30.1.11:9001/ws/

    # Configuración del tráfico HTTP normal
    ProxyPass / http://10.30.1.11:9001/
    ProxyPassReverse / http://10.30.1.11:9001/

    AllowEncodedSlashes NoDecode
    ErrorLog "logs/minio_console_error.log"
    CustomLog "logs/minio_console_access.log" common
    LogLevel debug
</VirtualHost>





Listen 3000

<VirtualHost *:3000>
    ServerName 181.115.47.107
    DocumentRoot "C:/Apache24/htdocs"
    
    # Módulos necesarios
    LoadModule proxy_module modules/mod_proxy.so
    LoadModule proxy_http_module modules/mod_proxy_http.so
    LoadModule headers_module modules/mod_headers.so
    
    # Configuración básica
    ProxyRequests Off
    ProxyPreserveHost On
    
    # Especificar el Host exacto que requiere la aplicación
    RequestHeader set Host "kgogwsw00cwcw8g0wk0gsogg.10.30.1.11.sslip.io"
    
    # Configuración del proxy - IMPORTANTE para Windows
    ProxyPass / http://kgogwsw00cwcw8g0wk0gsogg.10.30.1.11.sslip.io/
    ProxyPassReverse / http://kgogwsw00cwcw8g0wk0gsogg.10.30.1.11.sslip.io/
    
    # Configuración adicional para Windows
    AllowEncodedSlashes NoDecode
    ProxyPassReverseCookiePath / /
    
    # Logs para diagnóstico
    ErrorLog "logs/proxy_error.log"
    CustomLog "logs/proxy_access.log" common
    LogLevel debug
</VirtualHost>