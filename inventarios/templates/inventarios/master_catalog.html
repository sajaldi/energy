{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block extrahead %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --sap-shell: #354a5f;
        --sap-blue: #0a6ed1;
        --sap-blue-hover: #0854a0;
        --sap-bg: #f5f6f7;
        --sap-card: #ffffff;
        --sap-border: #d9d9d9;
        --sap-success: #107e3e;
        --sap-warning: #e9730c;
        --sap-error: #bb0000;
        --sap-info: #0a6ed1;
        --text-main: #32363a;
        --text-muted: #6a6d70;
        --text-label: #6a6d70;
        --radius: 4px;
    }

    body {
        font-family: 'Inter', '72', Arial, sans-serif !important;
        background: var(--sap-bg) !important;
        -webkit-font-smoothing: antialiased;
    }

    /* ====== PAGE SHELL ====== */
    .sap-page-shell {
        background: var(--sap-shell);
        padding: 20px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid var(--sap-blue);
    }
    .sap-page-shell h1 {
        margin: 0; font-size: 1.25rem; font-weight: 700;
        color: #fff; letter-spacing: -0.3px;
        display: flex; align-items: center; gap: 12px;
    }
    .sap-page-shell h1 ion-icon { font-size: 1.4rem; opacity: 0.8; }
    .sap-page-shell .subtitle {
        color: rgba(255,255,255,0.6); font-size: 0.8rem; font-weight: 400; margin-top: 2px;
    }
    .sap-breadcrumb {
        display: flex; align-items: center; gap: 8px;
        font-size: 0.8rem; color: rgba(255,255,255,0.5);
    }
    .sap-breadcrumb a { color: rgba(255,255,255,0.7); text-decoration: none; }
    .sap-breadcrumb a:hover { color: #fff; }

    /* ====== TOOLBAR ====== */
    .sap-toolbar {
        background: var(--sap-card);
        border: 1px solid var(--sap-border);
        border-radius: var(--radius);
        padding: 12px 20px;
        margin: 20px 24px 0;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .sap-toolbar .search-box {
        flex: 2; position: relative;
    }
    .sap-toolbar .search-box input {
        width: 100%; padding: 8px 12px 8px 36px;
        border: 1px solid var(--sap-border); border-radius: var(--radius);
        font-size: 0.875rem; font-family: inherit;
        background: var(--sap-bg); color: var(--text-main);
        height: 36px; box-sizing: border-box;
    }
    .sap-toolbar .search-box input:focus {
        border-color: var(--sap-blue); outline: none;
        box-shadow: 0 0 0 2px rgba(10, 110, 209, 0.15);
    }
    .sap-toolbar .search-box ion-icon {
        position: absolute; left: 10px; top: 50%;
        transform: translateY(-50%); color: var(--text-muted); font-size: 1rem;
    }
    .sap-toolbar select {
        flex: 1; padding: 8px 12px; height: 36px;
        border: 1px solid var(--sap-border); border-radius: var(--radius);
        font-size: 0.8rem; font-family: inherit;
        background: var(--sap-card); color: var(--text-main);
        cursor: pointer;
    }
    .sap-toolbar select:focus {
        border-color: var(--sap-blue); outline: none;
    }
    .sap-toolbar .results-count {
        font-size: 0.8rem; color: var(--text-muted); font-weight: 600;
        white-space: nowrap; padding: 0 8px;
    }
    .sap-btn-back {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 7px 16px; border-radius: var(--radius);
        border: 1px solid rgba(255,255,255,0.3);
        background: transparent; color: rgba(255,255,255,0.85);
        font-size: 0.8rem; font-weight: 600; text-decoration: none;
        cursor: pointer; transition: all 0.15s;
    }
    .sap-btn-back:hover {
        background: rgba(255,255,255,0.1); color: #fff;
        border-color: rgba(255,255,255,0.5);
    }

    /* ====== CONTENT AREA ====== */
    .sap-content { padding: 16px 24px; }

    /* ====== CATALOG GRID ====== */
    .catalog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
    }

    /* ====== MATERIAL CARD ====== */
    .mat-card {
        background: var(--sap-card);
        border: 1px solid var(--sap-border);
        border-radius: var(--radius);
        overflow: hidden;
        cursor: pointer;
        transition: box-shadow 0.2s, border-color 0.2s;
    }
    .mat-card:hover {
        border-color: var(--sap-blue);
        box-shadow: 0 4px 16px rgba(10, 110, 209, 0.12);
    }
    .mat-card .card-img {
        height: 140px; background: #f5f6f7;
        display: flex; align-items: center; justify-content: center;
        border-bottom: 1px solid var(--sap-border);
        padding: 12px;
    }
    .mat-card .card-img img {
        max-width: 100%; max-height: 100%; object-fit: contain;
    }
    .mat-card .card-body {
        padding: 12px 14px;
    }
    .mat-card .card-title {
        font-size: 0.85rem; font-weight: 700; color: var(--text-main);
        line-height: 1.3; margin-bottom: 4px;
        display: -webkit-box; -webkit-line-clamp: 2;
        -webkit-box-orient: vertical; overflow: hidden;
    }
    .mat-card .card-sku {
        font-size: 0.7rem; color: var(--text-muted);
        font-family: 'Courier New', monospace; font-weight: 600;
    }
    .mat-card .card-cat {
        font-size: 0.7rem; color: var(--sap-blue); font-weight: 600;
        margin-top: 4px;
    }
    .mat-card .card-footer {
        padding: 8px 14px;
        border-top: 1px solid #eee;
        display: flex; justify-content: space-between; align-items: center;
    }
    .stock-available {
        font-size: 0.75rem; font-weight: 700; color: var(--sap-success);
        display: flex; align-items: center; gap: 4px;
    }
    .stock-empty {
        font-size: 0.75rem; font-weight: 700; color: var(--sap-error);
        display: flex; align-items: center; gap: 4px;
    }
    .stock-qty {
        font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
    }

    /* ====== PAGINATION ====== */
    .sap-pagination {
        display: flex; justify-content: center; align-items: center;
        gap: 8px; margin-top: 24px; padding-bottom: 24px;
    }
    .sap-pagination button {
        padding: 6px 16px; border-radius: var(--radius);
        border: 1px solid var(--sap-border); background: var(--sap-card);
        color: var(--text-main); font-size: 0.8rem; font-weight: 600;
        cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .sap-pagination button:hover {
        border-color: var(--sap-blue); color: var(--sap-blue);
    }
    .sap-pagination .page-info {
        font-size: 0.8rem; color: var(--text-muted); font-weight: 500;
    }

    /* ====== DETAIL MODAL ====== */
    .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(53, 74, 95, 0.85);
        z-index: 10000; opacity: 0;
        transition: opacity 0.3s ease;
    }
    .modal-overlay.active {
        display: flex; opacity: 1;
        align-items: center; justify-content: center;
    }
    .modal-window {
        background: var(--sap-card); width: 92%; max-width: 1100px;
        height: 85vh; margin: auto;
        display: flex; flex-direction: column;
        border-radius: var(--radius);
        box-shadow: 0 24px 64px rgba(0,0,0,0.35);
        overflow: hidden;
        transform: scale(0.95); transition: transform 0.25s ease;
    }
    .modal-overlay.active .modal-window { transform: scale(1); }

    .modal-header-sap {
        background: var(--sap-shell); padding: 16px 24px;
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 3px solid var(--sap-blue);
    }
    .modal-header-sap h2 {
        margin: 0; font-size: 1rem; font-weight: 700; color: #fff;
        display: flex; align-items: center; gap: 10px;
    }
    .modal-header-sap .close-btn {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
        color: #fff; width: 32px; height: 32px;
        border-radius: var(--radius); cursor: pointer;
        font-size: 1rem; display: flex; align-items: center;
        justify-content: center; transition: all 0.15s;
    }
    .modal-header-sap .close-btn:hover {
        background: rgba(255,255,255,0.2);
    }

    /* Tabs */
    .sap-tabs {
        display: flex; background: #edeff0; padding: 0 24px;
        border-bottom: 1px solid var(--sap-border); gap: 0;
    }
    .sap-tab {
        padding: 10px 20px; border: none; background: none;
        font-weight: 600; color: var(--text-muted); cursor: pointer;
        font-size: 0.8rem; font-family: inherit;
        border-bottom: 2px solid transparent;
        transition: all 0.15s; letter-spacing: 0.3px;
    }
    .sap-tab:hover { color: var(--text-main); }
    .sap-tab.active {
        color: var(--sap-blue); border-bottom-color: var(--sap-blue);
        background: var(--sap-card);
    }
    .tab-content { display: none; height: 100%; }
    .tab-content.active { display: block; }

    /* Detail grid */
    .detail-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    }
    .detail-item {
        background: var(--sap-bg); padding: 12px 16px;
        border-radius: var(--radius); border: 1px solid var(--sap-border);
    }
    .detail-label {
        font-size: 0.7rem; font-weight: 700; color: var(--text-label);
        text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    }
    .detail-value {
        font-size: 0.95rem; font-weight: 700; color: var(--text-main);
    }

    /* Fix SweetAlert z-index */
    .swal2-container { z-index: 20000 !important; }

    /* Loading skeleton */
    .sap-loading {
        grid-column: 1/-1; text-align: center; padding: 80px 20px;
        color: var(--text-muted);
    }
    .sap-loading ion-icon {
        font-size: 2.5rem; display: block; margin: 0 auto 12px;
        animation: spin 1.5s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
{% endblock %}

{% block content %}
<!-- SAP Shell Header -->
<div class="sap-page-shell">
    <div>
        <h1>
            <ion-icon name="cube-outline"></ion-icon>
            Catálogo Maestro de Materiales
        </h1>
        <div class="subtitle">MM01 · Consulta global de existencias y fichas técnicas</div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
        <div class="sap-breadcrumb">
            <a href="{% url 'inventarios:dashboard' %}">Inventarios</a>
            <span>›</span>
            <span style="color: rgba(255,255,255,0.8);">Catálogo Maestro</span>
        </div>
        <a href="{% url 'inventarios:dashboard' %}" class="sap-btn-back">
            <ion-icon name="arrow-back-outline"></ion-icon> Volver
        </a>
    </div>
</div>

<!-- SAP Toolbar -->
<div class="sap-toolbar">
    <div class="search-box">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" id="search" placeholder="Buscar por nombre, SKU o descripción...">
    </div>
    <select id="warehouse">
        <option value="">Todas las Bodegas</option>
        {% for u in ubicaciones %}
        <option value="{{ u.id }}">{{ u.nombre }}</option>
        {% endfor %}
    </select>
    <select id="category">
        <option value="">Todas las Categorías</option>
        {% for cat in categorias %}
        <option value="{{ cat.id }}">{{ cat.nombre }}</option>
        {% endfor %}
    </select>
    <div class="results-count" id="results-count"></div>
</div>

<!-- Content Grid -->
<div class="sap-content">
    <div id="catalog-grid" class="catalog-grid">
        <!-- Dynamic content -->
    </div>
    <div id="pagination" class="sap-pagination"></div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-window">
        <div class="modal-header-sap">
            <h2>
                <ion-icon name="document-text-outline"></ion-icon>
                <span id="modal-title">Ficha de Material</span>
            </h2>
            <button class="close-btn" onclick="$('#detail-modal').removeClass('active')">✕</button>
        </div>
        <div class="sap-tabs">
            <button class="sap-tab active" onclick="switchTab('tab-general', this)">Información General</button>
            <button class="sap-tab" onclick="switchTab('tab-locations', this)">Existencias por Ubicación</button>
            <button class="sap-tab" onclick="switchTab('tab-history', this)">Historial de Movimientos</button>
            <button class="sap-tab" onclick="switchTab('tab-print', this)">Imprimir Etiqueta</button>
        </div>
        <div id="modal-content" style="flex:1; overflow-y:auto; padding: 24px;">
            <!-- Dynamic content -->
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    (function ($) {
        let currentPage = 1;

        async function loadCatalog(page = 1) {
            currentPage = page;
            const query = $('#search').val();
            const cat = $('#category').val();
            const warehouse = $('#warehouse').val();
            const grid = $('#catalog-grid');

            grid.html('<div class="sap-loading"><ion-icon name="sync-outline"></ion-icon>Cargando catálogo...</div>');

            try {
                const res = await fetch(`/inventarios/api/materials/?q=${query}&category=${cat}&ubicacion=${warehouse}&page=${page}`);
                const data = await res.json();
                const total = data.total || data.results.length;
                $('#results-count').text(`${total} materiales`);

                grid.empty();
                if (data.results.length === 0) {
                    grid.html('<div class="sap-loading" style="animation:none;"><ion-icon name="search-outline" style="animation:none; opacity:0.3;"></ion-icon>No se encontraron materiales con los filtros seleccionados.</div>');
                    return;
                }
                data.results.forEach(m => {
                    const hasStock = m.stock > 0;
                    grid.append(`
                        <div class="mat-card" onclick="showDetails(${m.id})">
                            <div class="card-img">
                                <img src="${m.image_url}" onerror="this.src='/static/core/img/placeholder.png'">
                            </div>
                            <div class="card-body">
                                <div class="card-title">${m.nombre}</div>
                                <div class="card-sku">${m.sku}</div>
                                <div class="card-cat">${m.categoria}</div>
                            </div>
                            <div class="card-footer">
                                <div class="${hasStock ? 'stock-available' : 'stock-empty'}">
                                    <ion-icon name="${hasStock ? 'checkmark-circle' : 'close-circle'}"></ion-icon>
                                    ${hasStock ? 'Disponible' : 'Sin Stock'}
                                </div>
                                <div class="stock-qty">${m.stock} ${m.unidad}</div>
                            </div>
                        </div>
                    `);
                });
                renderPagination(data);
            } catch (e) { console.error(e); }
        }

        window.showDetails = async (id) => {
            const modal = $('#detail-modal');
            const content = $('#modal-content');
            modal.addClass('active');
            $('.sap-tab').removeClass('active').first().addClass('active');
            content.html('<div class="sap-loading"><ion-icon name="sync-outline"></ion-icon>Cargando ficha técnica...</div>');

            try {
                const res = await fetch(`/inventarios/api/stock/${id}/`);
                const data = await res.json();
                $('#modal-title').text(data.nombre);

                content.html(`
                    <div id="tab-general" class="tab-content active">
                        <div style="display:grid; grid-template-columns: 300px 1fr; gap:32px;">
                            <div>
                                <div style="background:var(--sap-bg); padding:24px; border-radius:var(--radius); border:1px solid var(--sap-border); display:flex; align-items:center; justify-content:center; margin-bottom:16px; min-height:250px;">
                                    <img src="${data.image_url || ''}" class="expandable-img" style="max-width:100%; max-height:250px; object-fit:contain; cursor:zoom-in;">
                                </div>
                                <div class="detail-grid">
                                    <div class="detail-item">
                                        <div class="detail-label">Precio Est.</div>
                                        <div class="detail-value">L ${data.precio_estimado.toFixed(2)}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Stock Mín.</div>
                                        <div class="detail-value">${data.stock_minimo} ${data.unidad}</div>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                                    <span style="background:var(--sap-blue); color:#fff; padding:4px 12px; border-radius:var(--radius); font-weight:700; font-size:0.75rem;">${data.categoria || 'GENERAL'}</span>
                                    <span style="font-family:'Courier New',monospace; color:var(--text-muted); font-size:0.9rem; font-weight:700;"># ${data.sku}</span>
                                </div>
                                <h1 style="font-size:1.8rem; font-weight:800; margin:0 0 16px 0; color:var(--text-main); line-height:1.2;">${data.nombre}</h1>

                                <div class="detail-grid" style="margin-bottom:20px;">
                                    <div class="detail-item">
                                        <div class="detail-label">Marca</div>
                                        <div class="detail-value">${data.marca}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Tipo Material</div>
                                        <div class="detail-value">${data.tipo_material}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">Unidad</div>
                                        <div class="detail-value">${data.unidad}</div>
                                    </div>
                                    <div class="detail-item" style="background:#e8f4fd; border-color:#b3d7f2;">
                                        <div class="detail-label" style="color:var(--sap-blue);">Existencia Total</div>
                                        <div class="detail-value" style="color:var(--sap-blue); font-size:1.2rem;">${data.stock_total} ${data.unidad}</div>
                                    </div>
                                </div>

                                <div style="background:var(--sap-bg); padding:16px 20px; border-left:3px solid var(--sap-warning); border-radius:var(--radius); margin-bottom:20px;">
                                    <div class="detail-label" style="color:var(--sap-warning);">Descripción Técnica</div>
                                    <p style="font-size:0.9rem; line-height:1.6; color:var(--text-main); margin:6px 0 0;">${data.descripcion || 'Sin descripción disponible.'}</p>
                                </div>

                                <a href="/admin/inventarios/material/${id}/change/" style="display:inline-flex; align-items:center; gap:8px; padding:8px 20px; background:var(--sap-blue); color:#fff; text-decoration:none; border-radius:var(--radius); font-size:0.85rem; font-weight:600;">
                                    <ion-icon name="create-outline"></ion-icon> Editar Ficha
                                </a>
                            </div>
                        </div>
                    </div>

                    <div id="tab-locations" class="tab-content">
                        <div style="max-width:700px; margin:0 auto;">
                            <h3 style="font-weight:700; font-size:0.9rem; color:var(--text-main); margin:0 0 16px; padding-bottom:10px; border-bottom:1px solid var(--sap-border);">Disponibilidad en Bodegas</h3>
                            ${data.existencias.length > 0 ? data.existencias.map(ex => `
                                <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:var(--sap-card); border:1px solid var(--sap-border); border-radius:var(--radius); margin-bottom:8px;">
                                    <span style="font-weight:600; color:var(--text-main); font-size:0.9rem;">${ex.ubicacion}</span>
                                    <div style="text-align:right;">
                                        <span style="font-weight:800; color:var(--sap-blue); font-size:1.1rem;">${ex.cantidad} ${data.unidad}</span>
                                        ${ex.detalle ? `<div style="font-size:0.7rem; color:var(--text-muted); margin-top:2px;">Pasillo: ${ex.detalle}</div>` : ''}
                                    </div>
                                </div>
                            `).join('') : '<div style="text-align:center; padding:40px; color:var(--text-muted);">No hay existencias registradas.</div>'}
                        </div>
                    </div>

                    <div id="tab-history" class="tab-content">
                        <div style="max-width:900px; margin:0 auto; border:1px solid var(--sap-border); border-radius:var(--radius); overflow:hidden;">
                            <table style="width:100%; border-collapse:collapse;">
                                <thead>
                                    <tr style="background:var(--sap-bg); border-bottom:1px solid var(--sap-border);">
                                        <th style="padding:10px 16px; font-weight:700; color:var(--text-label); font-size:0.75rem; text-align:left;">FECHA</th>
                                        <th style="padding:10px 16px; font-weight:700; color:var(--text-label); font-size:0.75rem; text-align:left;">TIPO</th>
                                        <th style="padding:10px 16px; font-weight:700; color:var(--text-label); font-size:0.75rem; text-align:center;">CANTIDAD</th>
                                        <th style="padding:10px 16px; font-weight:700; color:var(--text-label); font-size:0.75rem; text-align:left;">USUARIO</th>
                                        <th style="padding:10px 16px; font-weight:700; color:var(--text-label); font-size:0.75rem; text-align:left;">COMENTARIOS</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.movimientos.length > 0 ? data.movimientos.map(m => `
                                        <tr style="border-bottom:1px solid #eee;">
                                            <td style="padding:10px 16px; font-size:0.85rem; color:var(--text-main);">${m.fecha}</td>
                                            <td style="padding:10px 16px;">
                                                <span style="background:${m.tipo === 'ENTRADA' ? '#e8f5e9' : '#fce4ec'}; color:${m.tipo === 'ENTRADA' ? 'var(--sap-success)' : 'var(--sap-error)'}; padding:3px 10px; border-radius:var(--radius); font-weight:700; font-size:0.7rem;">
                                                    ${m.tipo}
                                                </span>
                                            </td>
                                            <td style="padding:10px 16px; font-weight:800; color:var(--text-main); text-align:center;">
                                                ${m.tipo === 'ENTRADA' ? '+' : '-'}${m.cantidad}
                                            </td>
                                            <td style="padding:10px 16px; color:var(--text-muted); font-size:0.85rem;">${m.usuario}</td>
                                            <td style="padding:10px 16px; color:var(--text-muted); font-size:0.8rem;">${m.comentarios}</td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="5" style="padding:40px; text-align:center; color:var(--text-muted);">Sin movimientos registrados.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="tab-print" class="tab-content">
                        <div style="max-width:450px; margin:0 auto; text-align:center; padding:32px 0;">
                            <ion-icon name="print-outline" style="font-size:3rem; color:var(--sap-blue); margin-bottom:12px;"></ion-icon>
                            <h3 style="font-weight:700; color:var(--text-main); margin:0 0 6px;">Etiqueta Térmica</h3>
                            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:20px;">Genera un PDF con código QR y detalles (2" x 1.5").</p>

                            <div style="background:var(--sap-bg); padding:20px; border-radius:var(--radius); border:1px solid var(--sap-border); margin-bottom:20px;">
                                <div class="detail-label" style="margin-bottom:10px;">Cantidad de Etiquetas</div>
                                <div style="display:flex; justify-content:center; align-items:center; gap:10px;">
                                    <button onclick="updatePrintQty(-1)" style="width:36px; height:36px; border:1px solid var(--sap-border); background:var(--sap-card); border-radius:var(--radius); font-size:1.2rem; cursor:pointer;">−</button>
                                    <input type="number" id="print-qty" value="1" min="1" style="width:60px; height:36px; text-align:center; font-size:1.1rem; font-weight:700; border:1px solid var(--sap-blue); border-radius:var(--radius);">
                                    <button onclick="updatePrintQty(1)" style="width:36px; height:36px; border:1px solid var(--sap-border); background:var(--sap-card); border-radius:var(--radius); font-size:1.2rem; cursor:pointer;">+</button>
                                </div>
                            </div>

                            <button onclick="printMaterialLabel(${id})" style="width:100%; padding:10px; background:var(--sap-blue); color:#fff; border:none; border-radius:var(--radius); font-size:0.9rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit;">
                                <ion-icon name="download-outline"></ion-icon> Generar PDF
                            </button>
                            <p style="font-size:0.75rem; color:var(--text-muted); margin-top:12px;">
                                Configura tu impresora para papel de 2×1.5 pulgadas.
                            </p>
                        </div>
                    </div>
                `);
            } catch (e) {
                content.html('<div class="sap-loading" style="color:var(--sap-error);"><ion-icon name="alert-circle-outline" style="animation:none;"></ion-icon>Error al cargar la ficha técnica.</div>');
            }
        };

        window.switchTab = (tabId, btn) => {
            $('.tab-content').removeClass('active');
            $('.sap-tab').removeClass('active');
            $(`#${tabId}`).addClass('active');
            $(btn).addClass('active');
        };

        window.updatePrintQty = (delta) => {
            const input = $('#print-qty');
            let val = parseInt(input.val()) + delta;
            if (val < 1) val = 1;
            input.val(val);
        };

        window.printMaterialLabel = (id) => {
            const qty = $('#print-qty').val();
            window.open(`/inventarios/api/print-label/${id}/?qty=${qty}`, '_blank');
        };

        function renderPagination(data) {
            const pag = $('#pagination');
            pag.empty();
            if (currentPage > 1) {
                pag.append(`<button onclick="changePage(${currentPage - 1})">← Anterior</button>`);
            }
            pag.append(`<span class="page-info">Página ${currentPage}</span>`);
            if (data.has_next) {
                pag.append(`<button onclick="changePage(${currentPage + 1})">Siguiente →</button>`);
            }
        }

        window.changePage = (p) => loadCatalog(p);

        let searchTimer;
        $('#search').on('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadCatalog(1), 400);
        });
        $('#category, #warehouse').on('change', () => loadCatalog(1));

        loadCatalog();

        // Image zoom
        $(document).on('click', '.expandable-img', function () {
            const src = $(this).attr('src');
            if (!src) return;
            Swal.fire({
                imageUrl: src, imageAlt: 'Material',
                showCloseButton: true, showConfirmButton: false,
                width: 'auto', padding: '0',
                background: 'rgba(0,0,0,0.85)', backdrop: 'rgba(0,0,0,0.9)'
            });
        });
    })(jQuery);
</script>
{% endblock %}
