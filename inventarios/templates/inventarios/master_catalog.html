{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block extrahead %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #3b82f6;
        --bg-body: #f8fafc;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --radius-md: 4px;
    }

    body {
        font-family: 'Outfit', sans-serif !important;
        background-color: var(--bg-body) !important;
    }

    .catalog-wrapper {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 20px;
    }

    .header-box {
        background: white;
        padding: 40px;
        border-radius: var(--radius-md);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        margin-bottom: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header-box h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin: 0;
        color: var(--text-main);
    }

    .filter-bar {
        display: flex;
        gap: 20px;
        background: white;
        padding: 20px 40px;
        border-radius: var(--radius-md);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        margin-bottom: 40px;
        align-items: center;
    }

    .form-control {
        padding: 22px 30px;
        border: 2px solid #e2e8f0;
        border-radius: var(--radius-md);
        font-size: 1.2rem;
        background: white;
        color: #000 !important;
        font-weight: 600;
        width: 100%;
        line-height: 1;
        height: auto;
    }

    .form-control:focus {
        border-color: var(--primary);
        outline: none;
    }

    select.form-control {
        height: 74px;
        /* Altura fija para que coincida con el input */
    }

    /* Vinculemos la visibilidad del placeholder también */
    .form-control::placeholder {
        color: #94a3b8;
        font-weight: 400;
        font-size: 1.1rem;
    }

    .catalog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
    }

    .master-card {
        background: white;
        border: 2px solid #f1f5f9;
        border-radius: var(--radius-md);
        padding: 30px;
        text-align: center;
        transition: all 0.3s;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .master-card:hover {
        border-color: var(--primary);
        box-shadow: 0 20px 40px rgba(59, 130, 246, 0.1);
        transform: translateY(-5px);
    }

    .img-container {
        background: #f8fafc;
        padding: 20px;
        border-radius: var(--radius-md);
        margin-bottom: 20px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .stock-badge {
        background: #ecfdf5;
        color: #10b981;
        padding: 8px 15px;
        border-radius: var(--radius-md);
        font-weight: 800;
        font-size: 0.85rem;
        display: inline-block;
        margin-top: 15px;
    }

    .btn-back {
        background: #1e293b;
        color: white;
        padding: 12px 25px;
        border-radius: var(--radius-md);
        text-decoration: none;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }

    /* Modal Styling */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.4);
        z-index: 10000;
        backdrop-filter: blur(12px);
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
        display: flex;
        opacity: 1;
    }

    .modal-window {
        background: white;
        width: 90%;
        max-width: 1200px;
        height: 85vh;
        margin: auto;
        display: flex;
        flex-direction: column;
        border-radius: var(--radius-md);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.3);
        transform: scale(0.9);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        overflow: hidden;
    }

    .modal-overlay.active .modal-window {
        transform: scale(1);
    }

    .modal-header {
        padding: 30px 40px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .close-btn {
        background: #ef4444;
        /* Rojo vibrante */
        color: white;
        border: none;
        width: 60px;
        height: 60px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .close-btn:hover {
        background: #dc2626;
        /* Rojo más oscuro */
        transform: scale(1.05);
    }

    /* Tabs Styling */
    .tabs-nav {
        display: flex;
        background: #f1f5f9;
        padding: 10px 40px;
        gap: 10px;
        border-bottom: 2px solid #e2e8f0;
    }

    .tab-btn {
        padding: 12px 25px;
        border: none;
        background: none;
        font-weight: 800;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 4px;
        transition: all 0.2s;
    }

    .tab-btn.active {
        background: white;
        color: var(--primary);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .tab-content {
        display: none;
        height: 100%;
    }

    .tab-content.active {
        display: block;
    }

    .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .detail-item {
        background: #f8fafc;
        padding: 15px 20px;
        border-radius: var(--radius-md);
        border: 1px solid #e2e8f0;
    }

    .detail-label {
        font-size: 0.75rem;
        font-weight: 800;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .detail-value {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-main);
    }
</style>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
{% endblock %}

{% block content %}
<div class="catalog-wrapper">
    <div class="header-box">
        <div>
            <h1>📦 Catálogo Maestro</h1>
            <p style="color:var(--text-muted); font-size: 1.1rem;">Consulta global de existencias y materiales.</p>
        </div>
        <a href="{% url 'inventarios:dashboard' %}" class="btn-back">
            <ion-icon name="arrow-back-outline"></ion-icon> Volver al Dashboard
        </a>
    </div>

    <div class="filter-bar">
        <div style="flex: 2;">
            <input type="text" id="search" class="form-control"
                placeholder="🔍 Buscar material por nombre o código SKU...">
        </div>
        <div style="flex: 1;">
            <select id="warehouse" class="form-control">
                <option value="">Todas las Bodegas (Stock Total)</option>
                {% for u in ubicaciones %}
                <option value="{{ u.id }}">📦 {{ u.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="flex: 1;">
            <select id="category" class="form-control">
                <option value="">Todas las Categorías</option>
                {% for cat in categorias %}
                <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div id="catalog-grid" class="catalog-grid">
        <!-- Contenido dinámico -->
    </div>

    <div id="pagination"
        style="margin-top: 50px; text-align: center; display: flex; justify-content: center; gap: 15px;">
        <!-- Botones de paginación -->
    </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-window">
        <div class="modal-header">
            <h2 id="modal-title" style="margin:0; font-weight:800;">Detalles del Material</h2>
            <button class="close-btn" onclick="$('#detail-modal').removeClass('active')">✕</button>
        </div>
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('tab-general', this)">📦 INFORMACIÓN GENERAL</button>
            <button class="tab-btn" onclick="switchTab('tab-locations', this)">📍 EXISTENCIAS POR UBICACIÓN</button>
            <button class="tab-btn" onclick="switchTab('tab-history', this)">🕒 HISTORIAL DE MOVIMIENTOS</button>
            <button class="tab-btn" onclick="switchTab('tab-print', this)">🏷️ IMPRIMIR ETIQUETA</button>
        </div>
        <div id="modal-content" style="flex:1; overflow-y:auto; padding:50px;">
            <!-- Contenido dinámico -->
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    (function ($) {
        let currentPage = 1;

        async function loadCatalog(page = 1) {
            currentPage = page;
            const query = $('#search').val();
            const cat = $('#category').val();
            const warehouse = $('#warehouse').val();
            const grid = $('#catalog-grid');

            grid.html('<div style="grid-column: 1/-1; text-align:center; padding:100px;"><h3>Cargando catálogo...</h3></div>');

            try {
                const res = await fetch(`/inventarios/api/materials/?q=${query}&category=${cat}&ubicacion=${warehouse}&page=${page}`);
                const data = await res.json();

                grid.empty();
                if (data.results.length === 0) {
                    grid.html('<div style="grid-column: 1/-1; text-align:center; padding:100px; color:var(--text-muted);">No se encontraron materiales con los filtros aplicados.</div>');
                }
                data.results.forEach(m => {
                    grid.append(`
                        <div class="master-card" onclick="showDetails(${m.id})">
                            <div>
                                <div class="img-container">
                                    <img src="${m.image_url}" style="max-width:100%; max-height:100%; object-fit:contain;">
                                </div>
                                <div style="font-weight:800; color:var(--text-main); font-size: 1.1rem; margin-bottom:10px; line-height:1.3;">${m.nombre}</div>
                                <div style="font-size:0.8rem; color:var(--text-muted); font-family: monospace; text-transform:uppercase;">${m.sku}</div>
                                <div style="font-size:0.85rem; color:var(--primary); font-weight:700; margin-top:5px;">${m.categoria}</div>
                            </div>
                            <div>
                                <div class="stock-badge">
                                    ESTADO: ${m.stock > 0 ? 'DISPONIBLE' : 'SIN EXISTENCIAS'} (${m.stock} ${m.unidad})
                                </div>
                            </div>
                        </div>
                    `);
                });

                renderPagination(data);
            } catch (e) { console.error(e); }
        }

        window.showDetails = async (id) => {
            const modal = $('#detail-modal');
            const content = $('#modal-content');
            modal.addClass('active');

            // Reset tabs
            $('.tab-btn').removeClass('active');
            $('.tab-btn').first().addClass('active');

            content.html('<h3 style="text-align:center;">Cargando información completa...</h3>');

            try {
                const res = await fetch(`/inventarios/api/stock/${id}/`);
                const data = await res.json();

                content.html(`
                    <div id="tab-general" class="tab-content active">
                        <div style="display:grid; grid-template-columns: 1fr 1.2fr; gap:60px;">
                            <div>
                                <div style="background:#f8fafc; padding:40px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; border: 2px solid #e2e8f0; margin-bottom: 30px;">
                                    <img src="${data.image_url || ''}" class="expandable-img" style="width:100%; max-height:450px; object-fit:contain; cursor:zoom-in;">
                                </div>
                                
                                <div class="detail-grid">
                                    <div class="detail-item">
                                        <div class="detail-label">PRECIO ESTIMADO</div>
                                        <div class="detail-value">$ ${data.precio_estimado.toFixed(2)}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">STOCK MÍNIMO</div>
                                        <div class="detail-value">${data.stock_minimo} ${data.unidad}</div>
                                    </div>
                                </div>
                            </div>
                            
                            <div style="display: flex; flex-direction: column;">
                                <div style="margin-bottom:25px;">
                                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
                                        <span style="background:var(--primary); color:white; padding:6px 15px; border-radius:var(--radius-md); font-weight:800; font-size:0.85rem; text-transform:uppercase;">${data.categoria || 'GENERAL'}</span>
                                        <span style="font-family:monospace; color:var(--text-muted); font-size:1.1rem; font-weight:700;"># ${data.sku}</span>
                                    </div>
                                    <h1 style="font-size:3.5rem; font-weight:800; margin:0; color:#000; line-height:1.1;">${data.nombre}</h1>
                                </div>

                                <div class="detail-grid" style="margin-bottom:30px;">
                                    <div class="detail-item">
                                        <div class="detail-label">MARCA</div>
                                        <div class="detail-value">${data.marca}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">TIPO DE MATERIAL</div>
                                        <div class="detail-value">${data.tipo_material}</div>
                                    </div>
                                    <div class="detail-item">
                                        <div class="detail-label">UNIDAD DE MEDIDA</div>
                                        <div class="detail-value">${data.unidad}</div>
                                    </div>
                                    <div class="detail-item" style="background: #eff6ff; border-color: #bfdbfe;">
                                        <div class="detail-label" style="color:#1e40af;">EXISTENCIA TOTAL</div>
                                        <div class="detail-value" style="color:#1e40af; font-size:1.4rem;">${data.stock_total} ${data.unidad}</div>
                                    </div>
                                </div>

                                <div style="margin-bottom:40px; background:#fff9f0; padding:25px; border-left:5px solid #f59e0b; border-radius:var(--radius-md);">
                                    <h3 style="font-weight:800; margin:0 0 10px 0; color:#92400e; font-size:0.9rem; letter-spacing:1px;">DESCRIPCIÓN TÉCNICA</h3>
                                    <p style="font-size:1.2rem; line-height:1.6; color:#000; margin:0;">${data.descripcion || 'Sin descripción disponible.'}</p>
                                </div>

                                <div style="margin-top:auto; display:flex; gap:20px;">
                                    <a href="/admin/inventarios/material/${id}/change/" class="btn-back" style="flex:1; justify-content:center; padding:18px;">
                                        <ion-icon name="create" style="font-size:1.4rem;"></ion-icon> Editar Ficha Técnica
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="tab-locations" class="tab-content">
                        <div style="background:#f1f5f9; padding:40px; border-radius:var(--radius-md); border: 1px solid #e2e8f0; max-width: 800px; margin: 0 auto;">
                            <h3 style="font-weight:800; margin:0 0 25px 0; color:#0f172a; font-size:1.2rem; border-bottom:2px solid #cbd5e1; padding-bottom:10px;">📦 DISPONIBILIDAD EN BODEGAS</h3>
                            <div style="display: flex; flex-direction: column; gap: 15px;">
                                ${data.existencias.length > 0 ? data.existencias.map(ex => `
                                    <div style="display:flex; justify-content:space-between; align-items:center; padding:20px; background:white; border-radius:var(--radius-md); border:1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
                                        <span style="font-weight:700; color:#334155; font-size:1.2rem;">${ex.ubicacion}</span>
                                        <div style="text-align:right;">
                                            <span style="display:block; font-weight:800; color:var(--primary); font-size:1.6rem;">${ex.cantidad} ${data.unidad}</span>
                                            ${ex.detalle ? `<small style="color:var(--text-muted); font-weight:600;">PASILLO/ESTANTE: ${ex.detalle}</small>` : ''}
                                        </div>
                                    </div>
                                `).join('') : '<div style="text-align:center; padding:40px; color:var(--text-muted); font-weight:600;">No hay existencias registradas en ninguna bodega.</div>'}
                            </div>
                        </div>
                    </div>

                    <div id="tab-history" class="tab-content">
                        <div style="background:white; border-radius:var(--radius-md); border: 1px solid #e2e8f0; max-width: 1000px; margin: 0 auto; overflow: hidden;">
                            <table style="width:100%; border-collapse: collapse; text-align: left;">
                                <thead>
                                    <tr style="background: #f8fafc; border-bottom: 2px solid #e2e8f0;">
                                        <th style="padding: 20px; font-weight: 800; color: #475569; font-size: 0.85rem;">FECHA</th>
                                        <th style="padding: 20px; font-weight: 800; color: #475569; font-size: 0.85rem;">TIPO</th>
                                        <th style="padding: 20px; font-weight: 800; color: #475569; font-size: 0.85rem; text-align: center;">CANTIDAD</th>
                                        <th style="padding: 20px; font-weight: 800; color: #475569; font-size: 0.85rem;">USUARIO</th>
                                        <th style="padding: 20px; font-weight: 800; color: #475569; font-size: 0.85rem;">COMENTARIOS</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.movimientos.length > 0 ? data.movimientos.map(m => `
                                        <tr style="border-bottom: 1px solid #f1f5f9;">
                                            <td style="padding: 20px; font-weight: 600; color: #1e293b;">${m.fecha}</td>
                                            <td style="padding: 20px;">
                                                <span style="background: ${m.tipo === 'ENTRADA' ? '#ecfdf5' : '#fff1f2'}; color: ${m.tipo === 'ENTRADA' ? '#059669' : '#e11d48'}; padding: 6px 12px; border-radius: 4px; font-weight: 800; font-size: 0.75rem;">
                                                    ${m.tipo}
                                                </span>
                                            </td>
                                            <td style="padding: 20px; font-weight: 800; color: #0f172a; text-align: center; font-size: 1.1rem;">
                                                ${m.tipo === 'ENTRADA' ? '+' : '-'}${m.cantidad}
                                            </td>
                                            <td style="padding: 20px; color: #64748b; font-weight: 600;">${m.usuario}</td>
                                            <td style="padding: 20px; color: #64748b; font-size: 0.9rem;">${m.comentarios}</td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="5" style="padding:50px; text-align:center; color:var(--text-muted); font-weight:600;">No hay movimientos registrados recientemente.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="tab-print" class="tab-content">
                        <div style="background:white; border-radius:var(--radius-md); border: 2px solid #e2e8f0; max-width: 600px; margin: 0 auto; padding: 50px; text-align: center;">
                            <ion-icon name="print-outline" style="font-size: 5rem; color: var(--primary); margin-bottom: 20px;"></ion-icon>
                            <h2 style="font-weight:800; color:#0f172a; margin-bottom:10px;">Impresión de Etiqueta Térmica</h2>
                            <p style="color:var(--text-muted); margin-bottom:30px;">Genera una etiqueta de 2" x 1.5" con código QR y detalles técnicos.</p>
                            
                            <div style="background: #f8fafc; padding: 30px; border-radius: var(--radius-md); border: 1px solid #e2e8f0; margin-bottom: 30px;">
                                <div style="font-weight: 800; color: #475569; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 15px;">Cantidad de Etiquetas</div>
                                <div style="display: flex; justify-content: center; align-items: center; gap: 15px;">
                                    <button onclick="updatePrintQty(-1)" style="width: 50px; height: 50px; border-radius: 4px; border: 1px solid #cbd5e1; background: white; font-size: 1.5rem; cursor: pointer;">-</button>
                                    <input type="number" id="print-qty" value="1" min="1" style="width: 80px; height: 50px; text-align: center; font-size: 1.5rem; font-weight: 800; border: 2px solid var(--primary); border-radius: 4px;">
                                    <button onclick="updatePrintQty(1)" style="width: 50px; height: 50px; border-radius: 4px; border: 1px solid #cbd5e1; background: white; font-size: 1.5rem; cursor: pointer;">+</button>
                                </div>
                            </div>

                            <button onclick="printMaterialLabel(${id})" class="btn-back" style="width: 100%; justify-content: center; padding: 20px; font-size: 1.2rem; background: var(--primary); border: none;">
                                <ion-icon name="download-outline"></ion-icon> Generar PDF para Imprimir
                            </button>
                            
                            <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 20px;">
                                <ion-icon name="information-circle-outline"></ion-icon> Configura tu impresora térmica para papel de 2x1.5 pulgadas.
                            </p>
                        </div>
                    </div>
                `);
            } catch (e) {
                content.html('<h3 style="color:red; text-align:center;">Error al cargar la ficha técnica.</h3>');
            }
        }

        window.switchTab = (tabId, btn) => {
            $('.tab-content').removeClass('active');
            $('.tab-btn').removeClass('active');
            $(`#${tabId}`).addClass('active');
            $(btn).addClass('active');
        };

        window.updatePrintQty = (delta) => {
            const input = $('#print-qty');
            let val = parseInt(input.val()) + delta;
            if (val < 1) val = 1;
            input.val(val);
        };

        window.printMaterialLabel = (id) => {
            const qty = $('#print-qty').val();
            window.open(`/inventarios/api/print-label/${id}/?qty=${qty}`, '_blank');
        };

        function renderPagination(data) {
            const pag = $('#pagination');
            pag.empty();

            if (currentPage > 1) {
                pag.append(`<button onclick="changePage(${currentPage - 1})" class="btn-back" style="background:#f1f5f9; color:#1e293b;">Anterior</button>`);
            }

            if (data.has_next) {
                pag.append(`<button onclick="changePage(${currentPage + 1})" class="btn-back">Siguiente</button>`);
            }
        }

        window.changePage = (p) => loadCatalog(p);

        $('#search').on('input', () => {
            clearTimeout(window.searchTimer);
            window.searchTimer = setTimeout(() => loadCatalog(1), 500);
        });
        $('#category, #warehouse').on('change', () => loadCatalog(1));

        loadCatalog();

        // Manejador para expandir imágenes
        $(document).on('click', '.expandable-img', function () {
            const src = $(this).attr('src');
            if (!src || src.includes('placeholder')) return;

            Swal.fire({
                imageUrl: src,
                imageAlt: 'Imagen del Material',
                showCloseButton: true,
                showConfirmButton: false,
                width: 'auto',
                padding: '0',
                background: 'rgba(0,0,0,0.8)',
                backdrop: 'rgba(0,0,0,0.9)',
                customClass: {
