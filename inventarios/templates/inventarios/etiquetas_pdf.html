<!DOCTYPE html>
<html>

<head>
    <style>
        @page {
            size: 2in 1.5in;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            width: 2in;
            height: 1.5in;
            font-family: 'Arial', sans-serif;
            background-color: white;
            color: black;
        }

        .master-table {
            width: 1.95in;
            height: 1.45in;
            margin: 0.02in auto;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .top-row {
            height: 0.7in;
        }

        .qr-cell {
            width: 0.7in;
            text-align: center;
            vertical-align: middle;
        }

        .img-cell {
            width: 1.25in;
            text-align: center;
            vertical-align: middle;
        }

        .qr-img {
            width: 0.65in;
            height: 0.65in;
        }

        .product-img {
            width: auto;
            height: auto;
            max-width: 1in;
            max-height: 0.65in;
        }

        .description-row {
            height: 0.55in;
            vertical-align: top;
        }

        .description-box {
            border: 0.4pt solid #333;
            padding: 2px 4px;
            margin: 0 1px;
            height: 0.5in;
            overflow: hidden;
            background-color: #f9f9f9;
        }

        .description-text {
            font-size: 8pt;
            line-height: 1.1;
            margin: 0;
        }

        .sku-row {
            height: 0.2in;
            vertical-align: bottom;
            text-align: center;
        }

        .sku-text {
            font-size: 7.5pt;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #444;
            margin: 0;
            padding-bottom: 2px;
        }
    </style>
</head>

<body>
    {% for label in labels %}
    <table class="master-table">
        <tr class="top-row">
            <td class="qr-cell">
                <img src="data:image/png;base64,{{ label.qr_code }}" class="qr-img">
            </td>
            <td class="img-cell">
                {% if label.image_data %}
                <img src="data:image/image/png;base64,{{ label.image_data }}" class="product-img">
                {% else %}
                <div style="font-size: 6pt; color: #999;">[Sin Imagen]</div>
                {% endif %}
            </td>
        </tr>
        <tr>
            <td colspan="2" class="description-row">
                <div class="description-box">
                    <p class="description-text">
                        <strong>{{ label.nombre|truncatechars:100 }}</strong>
                    </p>
                </div>
            </td>
        </tr>
        <tr>
            <td colspan="2" class="sku-row">
                <p class="sku-text">{{ label.sku }}</p>
            </td>
        </tr>
    </table>
    {% if not forloop.last %}
    <pdf:nextpage />
    {% endif %}
    {% endfor %}
</body>

</html>
