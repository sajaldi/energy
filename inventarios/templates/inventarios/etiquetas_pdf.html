<!DOCTYPE html>
<html>

<head>
    <style>
        @page {
            size: 2in 1.5in;
            margin: 0;
        }

        body {
            font-family: 'Helvetica', sans-serif;
            margin: 0;
            padding: 0;
            width: 2in;
            height: 1.5in;
        }

        .label-outer {
            width: 1.9in;
            height: 1.4in;
            margin: 0.05in;
            border: 1.5pt solid #0f172a;
            border-radius: 10pt;
            background: white;
            padding: 5pt;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .qr-img {
            width: 0.5in;
            height: 0.5in;
        }

        /* Contenedor de la descripción con borde */
        .desc-container {
            border: 1pt solid #000;
            padding: 3pt;
            margin-top: 4pt;
        }
    </style>
</head>

<body>
    {% for label in labels %}
    <div class="label-outer">
        <table style="margin-bottom: 2pt;">
            <tr>
                <td style="width: 0.6in; vertical-align: middle;">
                    <img src="data:image/png;base64,{{ label.qr_code }}" class="qr-img">
                </td>
                <td style="text-align: center; vertical-align: middle; font-size: 14pt; font-weight: bold;">
                    {{ label.sku }}
                </td>
            </tr>
        </table>

        <div class="desc-container">
            <div style="font-size: 7pt; margin-bottom: 2pt;">Descripción</div>
            <div style="font-size: 9pt; font-weight: bold; line-height: 1.1;">
                {{ label.nombre|truncatechars:65 }}
            </div>
        </div>
    </div>
    {% if not forloop.last %}
    <pdf:nextpage />
    {% endif %}
    {% endfor %}
</body>

</html>
