<!DOCTYPE html>
<html>

<head>
    <style>
        @page {
            size: 2in 1.5in;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            width: 2in;
            height: 1.5in;
            font-family: 'Arial', sans-serif;
            background-color: white;
        }

        .master-table {
            width: 1.95in;
            height: 1.45in;
            margin: 0.02in auto;
            border: 0.2pt solid #000;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .header-row {
            height: 0.65in;
        }

        .qr-cell {
            width: 0.7in;
            text-align: center;
            vertical-align: middle;
            border-right: 0.1pt solid #ccc;
        }

        .qr-img {
            width: 0.55in;
            height: 0.55in;
        }

        .sku-cell {
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            font-size: 16pt;
        }

        .description-row {
            height: 0.7in;
            vertical-align: top;
        }

        .description-box {
            border: 0.5pt solid #000;
            padding: 3px;
            margin: 1px;
            height: 0.65in;
            overflow: hidden;
        }

        .description-text {
            font-size: 9pt;
            line-height: 1;
            margin: 0;
        }
    </style>
</head>

<body>
    {% for label in labels %}
    <table class="master-table">
        <tr class="header-row">
            <td class="qr-cell">
                <img src="data:image/png;base64,{{ label.qr_code }}" class="qr-img">
            </td>
            <td class="sku-cell">
                {{ label.sku }}
            </td>
        </tr>
        <tr>
            <td colspan="2" class="description-row">
                <div class="description-box">
                    <p class="description-text">
                        <strong>Descripción:</strong><br>
                        {{ label.nombre|truncatechars:105 }}
                    </p>
                </div>
            </td>
        </tr>
    </table>
    {% if not forloop.last %}
    <pdf:nextpage />
    {% endif %}
    {% endfor %}
</body>

</html>
