<form class="filter-bar" method="get">
    <div class="form-group">
        <label>BÚSQUEDA</label>
        <input type="text" name="search" class="form-control" placeholder="Nombre o código..." value="{{ search }}">
    </div>
    <div class="form-group">
        <label>FRECUENCIA</label>
        <select name="frecuencia" class="form-control">
            <option value="">Todas</option>
            {% for f in frecuencias %}
            <option value="{{ f.id }}" {% if f.id == frecuencia_selected %}selected{% endif %}>{{ f.nombre }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>PUESTO</label>
        <select name="puesto" class="form-control">
            <option value="">Todos</option>
            {% for p in puestos %}
            <option value="{{ p.id }}" {% if p.id == puesto_selected %}selected{% endif %}>{{ p.nombre }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div>
        <button type="submit" class="btn-search">Filtrar</button>
        <a href="." style="margin-left: 8px; color: var(--text-muted); font-size: 0.8rem;">Limpiar</a>
    </div>
</form>
