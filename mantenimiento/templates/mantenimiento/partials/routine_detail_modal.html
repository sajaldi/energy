<!-- routine_detail_modal.html -->
<div id="routineModal" class="modal-backdrop" style="display: none;">
    <div class="modal-glass">
        <button class="modal-close-btn" onclick="closeRoutineModal()">&times;</button>

        <div class="modal-header">
            <div class="header-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <path d="M14 2v6h6" />
                </svg>
            </div>
            <div class="header-text">
                <h2 id="m-routine-name">Nombre de la Rutina</h2>
                <span id="m-routine-code" class="code-badge">CODIGO</span>
            </div>
        </div>

        <div class="modal-tabs">
            <button class="tab-btn active" onclick="switchTab('general')">Información General</button>
            <button class="tab-btn" onclick="switchTab('history')">Historial de Ejecución</button>
        </div>

        <div class="modal-body">
            <!-- PESTAÑA GENERAL -->
            <div id="tab-general" class="tab-content active">
                <div class="info-grid">
                    <div class="info-item">
                        <label>Categoría</label>
                        <p id="m-category">-</p>
                    </div>
                    <div class="info-item">
                        <label>Frecuencia</label>
                        <p id="m-frequency">-</p>
                    </div>
                    <div class="info-item">
                        <label>Tiempo Estimado</label>
                        <p id="m-time">-</p>
                    </div>
                    <div class="info-item">
                        <label>Técnicos Requeridos</label>
                        <p id="m-techs">-</p>
                    </div>
                </div>

                <div class="info-block">
                    <label>Descripción</label>
                    <div id="m-description" class="text-content">Sin descripción.</div>
                </div>

                <div class="info-block">
                    <label>Herramientas y Materiales</label>
                    <div id="m-tools" class="text-content">Ninguna.</div>
                </div>
            </div>

            <!-- PESTAÑA HISTORIAL -->
            <div id="tab-history" class="tab-content">
                <div class="history-container" style="max-height: 400px; overflow-y: auto;">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Técnico</th>
                                <th>HH</th>
                                <th>Observaciones</th>
                            </tr>
                        </thead>
                        <tbody id="m-history-body">
                            <!-- Se llena vía JS -->
                        </tbody>
                    </table>
                    <div id="m-history-empty" style="display: none;" class="empty-history">
                        No hay registros de ejecución para esta rutina.
                    </div>
                </div>
            </div>

            <!-- CARGANDO -->
            <div id="modal-loader" class="modal-loader" style="display: none;">
                <div class="spinner"></div>
                <p style="font-weight: 600; color: #1e293b;">Cargando detalles...</p>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeRoutineModal()">Cerrar</button>
            <a id="m-edit-link" href="#" class="btn btn-primary" target="_blank">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    style="margin-right: 8px;">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg>
                Editar Rutina
            </a>
        </div>
    </div>
</div>
