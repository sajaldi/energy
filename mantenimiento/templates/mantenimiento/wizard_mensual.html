<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Matriz Mensual - Mantenimiento</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        :root {
            --primary: #c00000;
            --secondary: #1e293b;
            --accent: #ff4d4d;
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.9);
            --border: #e2e8f0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .wizard-container {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid white;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2rem;
            color: var(--secondary);
            margin: 0;
            font-weight: 700;
        }

        p.description {
            color: #64748b;
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary);
            font-size: 0.9rem;
        }

        select,
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
            background: white;
        }

        select:focus,
        input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(192, 0, 0, 0.1);
        }

        .options-list {
            max-height: 250px;
            overflow-y: auto;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            background: white;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-item:hover {
            background: #f8fafc;
        }

        .option-item:last-child {
            border-bottom: none;
        }

        .option-item input[type="checkbox"] {
            width: auto;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(192, 0, 0, 0.2);
        }

        .btn-primary:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--secondary);
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .card-icon {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }

        .step-dot.active {
            background: var(--primary);
            width: 24px;
            border-radius: 4px;
        }

        /* Beautiful animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .wizard-container {
            animation: slideIn 0.5s ease-out;
        }
    </style>
</head>

<body>

    <div class="wizard-container">
        <header>
            <div class="card-icon"><ion-icon name="calendar-number-outline"></ion-icon></div>
            <h1>Asistente de Matriz Mensual</h1>
            <p class="description">Configura los filtros para generar una vista optimizada del cronograma.</p>
        </header>

        <form action="{% url 'mantenimiento:cronograma_mensual_matriz' %}" method="get">
            <div class="grid">
                <div class="form-group">
                    <label>Año</label>
                    <input type="number" name="year" value="{{ current_year|default:2026 }}" required>
                </div>
                <div class="form-group">
                    <label>Mes</label>
                    <select name="month" required>
                        <option value="1">Enero</option>
                        <option value="2" selected>Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>
            </div>

            <div class="grid">
                <div class="form-group">
                    <label><ion-icon name="business-outline"></ion-icon> Filtrar por Edificio (Opcional)</label>
                    <div class="options-list">
                        <div class="option-item" onclick="this.querySelector('input').click()">
                            <input type="checkbox" name="all_locations" value="true">
                            <span>Todos los edificios</span>
                        </div>
                        {% for ubi in ubicaciones %}
                        <div class="option-item" onclick="this.querySelector('input').click()">
                            <input type="checkbox" name="ubicacion_ids" value="{{ ubi.id }}">
                            <span>{{ ubi.nombre }}</span>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                <div class="form-group">
                    <label><ion-icon name="construct-outline"></ion-icon> Filtrar por Sistema (Opcional)</label>
                    <div class="options-list">
                        <div class="option-item" onclick="this.querySelector('input').click()">
                            <input type="checkbox" name="all_categories" value="true">
                            <span>Todos los sistemas</span>
                        </div>
                        {% for cat in categorias %}
                        <div class="option-item" onclick="this.querySelector('input').click()">
                            <input type="checkbox" name="categoria_ids" value="{{ cat.id }}">
                            <span>{{ cat.nombre }}</span>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label><ion-icon name="layers-outline"></ion-icon> Modo de Visualización</label>
                <select name="view_mode">
                    <option value="sistema" selected>Agrupar por Sistema (Primario)</option>
                    <option value="ubicacion">Agrupar por Edificio (Primario)</option>
                </select>
            </div>

            <div class="actions">
                <a href="{% url 'mantenimiento:cronograma' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Generar Matriz</button>
            </div>
        </form>
    </div>

    <script>
        // Prevenir que el click en el checkbox doble-cliquee por el onclick del div
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('click', (e) => e.stopPropagation());
        });
    </script>

</body>

</html>
