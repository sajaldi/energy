<!-- PWA Meta Tags -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#007bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SoftCoM">
<link rel="apple-touch-icon" href="/static/core/img/icon-512.png">

<!-- PWA Registration Script -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registrado', reg))
                .catch(err => console.error('Error al registrar Service Worker', err));
        });
    }

    // iOS Install Prompt Helper
    window.addEventListener('load', () => {
        const isIos = () => {
            const userAgent = window.navigator.userAgent.toLowerCase();
            return /iphone|ipad|ipod/.test(userAgent);
        };
        const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);

        if (isIos() && !isInStandaloneMode()) {
            // Check if we already dismissed it
            if (!localStorage.getItem('ios_install_dismissed')) {
                const iosPrompt = document.createElement('div');
                iosPrompt.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:90%; background:#fff; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.2); padding:16px; z-index:99999; text-align:center; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; border:2px solid #007bff;';
                iosPrompt.innerHTML = `
                    <div style="font-weight:bold; color:#333; margin-bottom:8px;">📱 Instalar SoftCoM App</div>
                    <div style="font-size:13px; color:#555; line-height:1.4;">
                        Para instalar, pulsa el botón <b>Compartir</b> <svg width="14" height="18" viewBox="0 0 14 18" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle"><path d="M7 0V11M7 0L3 4M7 0L11 4M1 17H13" stroke="#007bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> en la barra inferior y selecciona <b>Añadir a la pantalla de inicio</b>.
                    </div>
                    <button id="close-ios-prompt" style="margin-top:12px; border:none; background:#f0f0f0; padding:6px 20px; border-radius:20px; color:#333; font-weight:bold; cursor:pointer;">Entendido</button>
                `;
                document.body.appendChild(iosPrompt);

                document.getElementById('close-ios-prompt').addEventListener('click', () => {
                    localStorage.setItem('ios_install_dismissed', 'true');
                    iosPrompt.style.display = 'none';
                });
            }
        }
    });

    // Global Home Button Injector
    window.addEventListener('load', () => {
        const path = window.location.pathname;
        if (path === '/app/' || path === '/portal/' || path.includes('/admin/')) return;

        const header = document.querySelector('header');
        if (header && !document.getElementById('global-home-btn')) {
            const homeBtn = document.createElement('a');
            homeBtn.id = 'global-home-btn';
            homeBtn.href = '/app/';
            // Estilo consistente con SAP Fiori / Outfit
            homeBtn.style.cssText = 'color: #2563eb; font-size: 24px; display: flex; align-items: center; text-decoration: none; padding: 5px; margin-left: 5px; order: -1;';
            homeBtn.innerHTML = '<ion-icon name="home-outline"></ion-icon>';
            
            // Si hay un contenedor de título o botones, lo insertamos ahí
            const titleContainer = header.querySelector('.header-title') || header.querySelector('.back-btn')?.parentElement;
            if (titleContainer) {
                titleContainer.prepend(homeBtn);
            } else {
                header.prepend(homeBtn);
            }
        }
    });
    // Global OT Deletion Controller
    (function() {
        // Load SweetAlert2 if not already present
        if (!window.Swal) {
            const script = document.createElement('script');
            script.src = "https://cdn.jsdelivr.net/npm/sweetalert2@11";
            document.head.appendChild(script);
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        let pressTimer;
        
        function initLongPress() {
            // Buscamos cualquier elemento con data-ot-id que no haya sido inicializado
            const otElements = document.querySelectorAll('[data-ot-id]:not([data-lp-ready])');
            
            otElements.forEach(el => {
                el.setAttribute('data-lp-ready', 'true');
                
                const startPress = (e) => {
                    if (e.type === 'mousedown' && e.button !== 0) return;
                    pressTimer = window.setTimeout(() => {
                        triggerDelete(el);
                    }, 800);
                };

                const cancelPress = () => {
                    clearTimeout(pressTimer);
                };

                el.addEventListener('mousedown', startPress);
                el.addEventListener('touchstart', startPress, {passive: true});
                el.addEventListener('mouseup', cancelPress);
                el.addEventListener('mouseleave', cancelPress);
                el.addEventListener('touchend', cancelPress);
                el.addEventListener('touchcancel', cancelPress);
                
                // Prevenir navegación accidental si se activó el borrado
                el.addEventListener('click', (e) => {
                    if (el.dataset.longPressed === 'true') {
                        e.preventDefault();
                        el.dataset.longPressed = 'false';
                    }
                });
            });
        }

        async function triggerDelete(el) {
            el.dataset.longPressed = 'true';
            // Sanitizar ID: eliminar cualquier coma o punto de formato decimal/miles
            let otId = el.getAttribute('data-ot-id');
            if (otId) otId = otId.toString().replace(/[,.]/g, '');
            
            const otCode = el.getAttribute('data-ot-codigo') || 'esta orden';
            const estado = el.getAttribute('data-ot-estado');

            // Validar estados permitidos (ESPERA, PROGRAMADA, EJECUCION)
            const allowedStates = ['ESPERA', 'PROGRAMADA', 'EJECUCION'];
            if (!allowedStates.includes(estado)) {
                // Opcional: Feedback de que este estado no se puede borrar
                return;
            }

            if (!window.Swal) return;

            const result = await Swal.fire({
                title: '¿Eliminar Orden?',
                text: `¿Eliminar la orden ${otCode}? Esta acción no se puede deshacer.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#bb0000',
                cancelButtonColor: '#6a6d70',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar',
                reverseButtons: true
            });

            if (result.isConfirmed) {
                Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                try {
                    const response = await fetch('/mantenimiento/api/delete-ots/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: JSON.stringify({ ot_ids: [otId] })
                    });

                    const data = await response.json();
                    if (data.status === 'success') {
                        el.style.transition = 'all 0.3s ease';
                        el.style.opacity = '0';
                        el.style.transform = 'scale(0.8)';
                        setTimeout(() => {
                            el.remove();
                            // Intentar actualizar cualquier contador de insignias (.count-badge)
                            const badge = document.querySelector('.count-badge');
                            if (badge) badge.innerText = Math.max(0, parseInt(badge.innerText) - 1);
                        }, 300);
                        Swal.fire({ icon: 'success', title: 'Eliminada', timer: 1500, showConfirmButton: false });
                    } else {
                        Swal.fire('Error', data.message || 'No se pudo eliminar.', 'error');
                    }
                } catch (error) {
                    Swal.fire('Error', 'Error de conexión.', 'error');
                }
            }
        }

        // Inicializar y observar cambios en el DOM
        window.addEventListener('load', () => {
            initLongPress();
            const observer = new MutationObserver(initLongPress);
            observer.observe(document.body, { childList: true, subtree: true });
        });
    })();
</script>
