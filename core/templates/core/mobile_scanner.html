{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escáner QR - SoftCoM</title>
    {% include 'core/pwa_tags.html' %}
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #0696D7;
            --primary-dark: #0582B9;
            --fusion-bg: #F9F9F9;
            --fusion-border: #D5D5D5;
            --fusion-text: #2D2D2D;
            --fusion-sec: #64748b;
            --dark: #212529;
            --bg-overlay: rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            background-color: black;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            font-size: 28px;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        #reader {
            flex: 1;
            width: 100% !important;
            height: 100% !important;
            position: relative;
        }

        #reader__dashboard,
        #reader__status_span,
        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        #reader__scan_region {
            background: none !important;
        }

        .scanner-controls {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: background 0.2s;
        }

        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 2px solid var(--primary);
            border-radius: 20px;
            box-shadow: 0 0 0 2000px var(--bg-overlay);
            pointer-events: none;
            z-index: 900;
        }

        .scanner-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: scan-line 2s infinite linear;
        }

        @keyframes scan-line {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        .status-msg {
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 1000;
            padding: 10px;
            pointer-events: none;
        }

        .status-pill {
            display: inline-block;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            backdrop-filter: blur(5px);
        }

        #error-toast {
            position: fixed;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: #ef4444;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            text-align: center;
            transform: translateY(200px);
            transition: transform 0.3s ease;
            z-index: 2000;
        }

        /* Maintenance Hub Overlay */
        .hub-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            z-index: 2100;
            display: none;
            align-items: flex-end;
            transition: opacity 0.3s;
        }

        .hub-overlay.active { display: flex; opacity: 1; }

        .hub-card {
            width: 100%;
            background: var(--fusion-bg);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--fusion-text);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }

        .hub-overlay.active .hub-card { transform: translateY(0); }

        .hub-header {
            padding: 20px;
            border-bottom: 1px solid var(--fusion-border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hub-asset-info h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .hub-asset-info p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--fusion-sec);
            font-weight: 500;
        }

        .close-hub {
            background: #e2e8f0;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--fusion-sec);
            cursor: pointer;
        }

        .hub-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .hub-section { margin-bottom: 24px; }

        .hub-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--fusion-sec);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hub-action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .hub-btn {
            background: white;
            border: 1px solid var(--fusion-border);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--fusion-text);
            transition: all 0.2s;
        }

        .hub-btn:active { background: #f1f5f9; transform: scale(0.98); }
        .hub-btn ion-icon { font-size: 24px; color: var(--primary); }
        .hub-btn span { font-size: 12px; font-weight: 600; text-align: center; }

        .hub-list { display: flex; flex-direction: column; gap: 10px; }

        .hub-list-item {
            background: white;
            border: 1px solid var(--fusion-border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .hub-list-info { flex: 1; }
        .hub-list-title { font-size: 14px; font-weight: 600; margin: 0; color: var(--fusion-text); }
        .hub-list-meta { font-size: 11px; color: var(--fusion-sec); margin: 2px 0 0 0; }

        .hub-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-ejecucion { background: #e0f2fe; color: #0369a1; }
        .badge-programada { background: #fef3c7; color: #92400e; }
        .badge-espera { background: #fef3c7; color: #92400e; }
        .badge-history { background: #f1f5f9; color: #475569; }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--fusion-sec);
            font-size: 13px;
            font-style: italic;
        }
    </style>
</head>

<body>

    <header>
        <button onclick="window.location.href='{% if request.GET.next %}{{ request.GET.next }}{% else %}{% url 'core:mobile_dashboard' %}{% endif %}'" class="back-btn">
            <ion-icon name="arrow-back-outline"></ion-icon>
        </button>
        <h1 id="scanner-title">Escáner de Equipos</h1>
    </header>

    <div class="status-msg">
        <span class="status-pill" id="main-pill">Enfoca el código QR del equipo</span>
    </div>

    <div id="reader"></div>
    <div class="scanner-overlay"></div>

    <div class="scanner-controls">
        <button class="control-btn" id="finish-btn" style="display: none; width: auto; border-radius: 30px; padding: 0 25px; background: var(--primary); font-size: 14px; font-weight: 700;">
            FINALIZAR ESCANEO (<span id="batch-count">0</span>)
        </button>
        <button class="control-btn" id="flash-toggle">
            <ion-icon name="flashlight-outline"></ion-icon>
        </button>
        <button class="control-btn" id="camera-switch">
            <ion-icon name="camera-reverse-outline"></ion-icon>
        </button>
    </div>

    <!-- Maintenance Hub Overlay -->
    <div id="hubOverlay" class="hub-overlay">
        <div class="hub-card">
            <div class="hub-header">
                <div class="hub-asset-info">
                    <h2 id="hubAssetName">Nombre del Equipo</h2>
                    <p id="hubAssetCode">Código: --- | Categoría: ---</p>
                </div>
                <button class="close-hub" onclick="closeHub()">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
            <div class="hub-body">
                <div class="hub-action-grid">
                    <a href="#" id="hubBtnDetalle" class="hub-btn">
                        <ion-icon name="information-circle-outline"></ion-icon>
                        <span>Procedimiento</span>
                    </a>
                    <a href="#" id="hubBtnReportar" class="hub-btn" style="border-color: #ef4444;">
                        <ion-icon name="alert-circle-outline" style="color: #ef4444;"></ion-icon>
                        <span style="color: #ef4444;">Reportar Falla</span>
                    </a>
                </div>

                <div class="hub-section">
                    <div class="hub-section-title">
                        <ion-icon name="play-circle-outline"></ion-icon> Rutinas en Curso
                    </div>
                    <div id="activeRoutinesList" class="hub-list"></div>
                </div>

                <div class="hub-section">
                    <div class="hub-section-title">
                        <ion-icon name="add-circle-outline"></ion-icon> Iniciar Nueva Rutina
                    </div>
                    <div id="applicableRoutinesList" class="hub-list"></div>
                </div>

                <div class="hub-section">
                    <div class="hub-section-title">
                        <ion-icon name="time-outline"></ion-icon> Historial Reciente
                    </div>
                    <div id="historyRoutinesList" class="hub-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="error-toast"></div>

    <script>
        const html5QrCode = new Html5Qrcode("reader", { experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
        let isFlashOn = false;
        let qrPaused = false;
        const scannedCodes = new Set();
        const finishBtn = document.getElementById('finish-btn');
        const batchCountSpan = document.getElementById('batch-count');

        // Observer for iOS Safari playsinline
        const _videoObserver = new MutationObserver((mutations) => {
            for (const mutation of mutations) {
                if (mutation.type === 'childList') {
                    const video = document.querySelector('#reader video');
                    if (video && !video.hasAttribute('playsinline')) {
                        video.setAttribute('playsinline', 'true');
                        video.setAttribute('webkit-playsinline', 'true');
                        video.muted = true;
                        video.play().catch(() => {});
                    }
                }
            }
        });
        _videoObserver.observe(document.getElementById('reader'), { childList: true, subtree: true });

        function showToast(msg) {
            const toast = document.getElementById('error-toast');
            toast.innerText = msg;
            toast.style.transform = 'translateY(0)';
            setTimeout(() => { toast.style.transform = 'translateY(200px)'; }, 3000);
        }

        const onScanSuccess = (decodedText, decodedResult) => {
            if (qrPaused) return;
            
            const urlParams = new URLSearchParams(window.location.search);
            const isMulti = urlParams.get('multi') === '1';
            const skipResolver = urlParams.get('skip_resolver') === '1';
            const apiUrl = urlParams.get('api_url');
            const nextUrl = urlParams.get('next');

            if (!isMulti) qrPaused = true;
            if (navigator.vibrate) navigator.vibrate(100);

            // 1. MODO BATCH
            if (isMulti && !apiUrl && nextUrl) {
                if (!scannedCodes.has(decodedText)) {
                    scannedCodes.add(decodedText);
                    batchCountSpan.innerText = scannedCodes.size;
                    finishBtn.style.display = 'flex';
                    const pill = document.querySelector('.status-pill');
                    pill.innerText = `Agregado: ${decodedText.slice(0, 10)}...`;
                    pill.style.background = '#059669';
                    setTimeout(() => { pill.innerText = "Escaneando continuamente..."; pill.style.background = 'rgba(0,0,0,0.5)'; }, 800);
                }
                return;
            }

            // 2. MODO RÁFAGA API
            if (isMulti && apiUrl) {
                const extraDataJson = urlParams.get('extra_data'); 
                const pill = document.querySelector('.status-pill');
                const originalText = pill.innerText;
                pill.innerText = `Capturado: ${decodedText.slice(0, 10)}... ✓`;
                pill.style.background = '#059669';
                
                const bodyData = { codigo: decodedText };
                if (extraDataJson) {
                    extraDataJson.split(',').forEach(kv => {
                        const [k, v] = kv.split('=');
                        if (k && v) bodyData[k] = v;
                    });
                }

                fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                    body: JSON.stringify(bodyData)
                })
                .then(r => r.json())
                .then(data => {
                    if (data.status !== 'success') showToast(data.message || 'Error al registrar');
                    setTimeout(() => { pill.innerText = originalText; pill.style.background = 'rgba(0,0,0,0.5)'; }, 800);
                }).catch(() => showToast('Error de conexión'));
                return;
            }

            // 3. MODO BYPASS
            if (skipResolver && nextUrl) {
                const separator = nextUrl.includes('?') ? '&' : '?';
                window.location.href = `${nextUrl}${separator}code=${encodeURIComponent(decodedText)}`;
                return;
            }

            // 4. MODO ESTÁNDAR (MAINTENANCE HUB)
            fetch(`{% url 'core:qr_resolver' %}?code=${encodeURIComponent(decodedText)}`)
                .then(r => r.json())
                .then(data => {
                    if (data.success && (data.is_activo || data.is_routine)) {
                        showMaintenanceHub(data);
                    } else if (data.success && data.redirect) {
                        window.location.href = data.redirect;
                    } else if (data.success && data.is_punto_medicion) {
                        window.location.href = data.start_url;
                    } else {
                        showToast(data.error || 'Código no válido');
                        setTimeout(() => { qrPaused = false; }, 2000);
                    }
                }).catch(() => { showToast('Error de conexión'); setTimeout(() => { qrPaused = false; }, 2000); });
        };

        function showMaintenanceHub(data) {
            const asset = data.activo;
            document.getElementById('hubAssetName').innerText = asset.nombre;
            document.getElementById('hubAssetCode').innerText = `Código: ${asset.codigo} | ${asset.categoria}`;
            
            const btnDetalle = document.getElementById('hubBtnDetalle');
            if (data.is_routine) {
                btnDetalle.href = "javascript:void(0)";
                btnDetalle.onclick = () => showRoutinePreview(data.routine_id);
                document.getElementById('hubBtnReportar').style.display = 'none';
                document.getElementById('scanner-title').innerText = "Hub de Rutina";
            } else {
                btnDetalle.href = asset.url_detalle;
                btnDetalle.onclick = null;
                document.getElementById('hubBtnReportar').style.display = 'flex';
                document.getElementById('hubBtnReportar').href = asset.url_reportar;
                document.getElementById('scanner-title').innerText = "Hub del Equipo";
            }

            const activeList = document.getElementById('activeRoutinesList');
            activeList.innerHTML = data.active_ots.length > 0 ? data.active_ots.map(ot => `
                <a href="${ot.url}" class="hub-list-item">
                    <div class="hub-list-info">
                        <p class="hub-list-title">${ot.rutina_nombre}</p>
                        <p class="hub-list-meta">ID: ${ot.id} | Téc: ${ot.tecnico}</p>
                    </div>
                    <span class="hub-badge badge-${ot.estado.toLowerCase()}">${ot.estado}</span>
                </a>
            `).join('') : '<div class="empty-state">No hay órdenes en curso</div>';

            const appList = document.getElementById('applicableRoutinesList');
            appList.innerHTML = data.applicable_routines.length > 0 ? data.applicable_routines.map(r => `
                <a href="${r.start_url}" class="hub-list-item">
                    <div class="hub-list-info">
                        <p class="hub-list-title">${r.nombre}</p>
                        <p class="hub-list-meta">Tocar para iniciar nueva ejecución</p>
                    </div>
                    <ion-icon name="chevron-forward-outline" style="color:#0696D7"></ion-icon>
                </a>
            `).join('') : '<div class="empty-state">Sin rutinas aplicables</div>';

            const histList = document.getElementById('historyRoutinesList');
            histList.innerHTML = data.history_ots.length > 0 ? data.history_ots.map(ot => `
                <a href="${ot.url}" class="hub-list-item">
                    <div class="hub-list-info">
                        <p class="hub-list-title">${ot.rutina_nombre}</p>
                        <p class="hub-list-meta">${ot.fecha}</p>
                    </div>
                    <span class="hub-badge badge-history">#${ot.id}</span>
                </a>
            `).join('') : '<div class="empty-state">Sin historial reciente</div>';

            document.getElementById('hubOverlay').classList.add('active');
        }

        async function showRoutinePreview(routineId) {
            Swal.fire({
                title: 'Cargando procedimiento...',
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const r = await fetch(`/mantenimiento/rutinas/dashboard/detail/${routineId}/`);
                const data = await r.json();
                
                if (data.status === 'success') {
                    let stepsHtml = '<div style="text-align: left; font-size: 13px;">';
                    data.rutina.pasos.forEach(p => {
                        let mediaHtml = '';
                        if (p.media && p.media.length > 0) {
                            mediaHtml = '<div style="display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 8px;">';
                            p.media.forEach(m => {
                                if (m.tipo === 'IMAGE') {
                                    mediaHtml += `<img src="${m.url}" style="height: 100px; width: 140px; border-radius: 4px; border: 1px solid #ddd; object-fit: cover; flex-shrink:0;" onclick="window.open('${m.url}', '_blank')">`;
                                } else if (m.tipo === 'VIDEO') {
                                    mediaHtml += `
                                        <div style="position: relative; height: 100px; width: 140px; background: #000; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink:0;" onclick="window.open('${m.url}', '_blank')">
                                            <ion-icon name="play-circle" style="color: white; font-size: 40px;"></ion-icon>
                                            <span style="position:absolute; bottom:5px; right:5px; font-size:8px; color:white; background:rgba(0,0,0,0.5); padding:2px 4px; border-radius:2px;">VIDEO</span>
                                        </div>`;
                                }
                            });
                            mediaHtml += '</div>';
                        }

                        stepsHtml += `
                            <div style="margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #eee;">
                                <div style="display: flex; gap: 12px;">
                                    <b style="color: #0696D7; font-size: 14px;">${p.orden}.</b>
                                    <div style="flex: 1;">
                                        <div style="font-weight: 700; color: #333; margin-bottom: 4px;">${p.descripcion}</div>
                                        ${p.verificacion ? `<div style="font-size: 11px; color: #666; background: #f9f9f9; padding: 5px; border-radius: 4px; margin-top: 5px; border-left: 3px solid #ddd;">${p.verificacion}</div>` : ''}
                                        ${mediaHtml}
                                    </div>
                                </div>
                            </div>`;
                    });
                    stepsHtml += '</div>';

                    Swal.fire({
                        title: `<span style="font-size: 18px; font-weight: 800;">${data.rutina.nombre}</span>`,
                        html: `
                            <div style="text-align: left; margin-bottom: 20px; display: flex; gap: 15px;">
                                <div style="font-size: 11px; color: #666; background: #eee; padding: 4px 8px; border-radius: 4px;">FREC: <b>${data.rutina.frecuencia}</b></div>
                                <div style="font-size: 11px; color: #666; background: #eee; padding: 4px 8px; border-radius: 4px;">TIEMPO: <b>${data.rutina.tiempo_estimado}</b></div>
                            </div>
                            <div style="max-height: 50vh; overflow-y: auto; padding-right: 5px; border-top: 2px solid #333; pt: 15px;">
                                <h4 style="font-size: 12px; color: #999; margin: 15px 0 10px 0; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">Pasos del Procedimiento</h4>
                                ${stepsHtml}
                            </div>
                        `,
                        width: '95%',
                        confirmButtonText: 'Cerrar',
                        confirmButtonColor: '#323232'
                    });
                }
            } catch (e) { 
                console.error(e);
                Swal.fire('Error', 'No se pudo cargar el procedimiento', 'error'); 
            }
        }


        function closeHub() {
            document.getElementById('hubOverlay').classList.remove('active');
            setTimeout(() => { qrPaused = false; }, 300);
        }

        async function startScanner() {
            try {
                const devices = await Html5Qrcode.getCameras();
                let cameraId = null;
                if (devices && devices.length > 0) {
                    const backCamera = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('trasera') || d.label.toLowerCase().includes('environment'));
                    cameraId = backCamera ? backCamera.id : devices[0].id;
                }
                await html5QrCode.start(cameraId || { facingMode: "environment" }, { fps: 15, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 }, onScanSuccess, () => {});
            } catch (err) {
                showToast("Error de cámara: " + err);
            }
        }

        window.addEventListener('load', () => setTimeout(startScanner, 500));

        document.getElementById('flash-toggle').addEventListener('click', async () => {
            try {
                const track = html5QrCode.getRunningTrack();
                if (track && track.getCapabilities().torch) {
                    isFlashOn = !isFlashOn;
                    await track.applyConstraints({ advanced: [{ torch: isFlashOn }] });
                    document.getElementById('flash-toggle').style.color = isFlashOn ? '#ffc107' : 'white';
                } else showToast("Flash no disponible");
            } catch (e) { showToast("Error flash"); }
        });

        document.getElementById('camera-switch').addEventListener('click', () => location.reload());
        finishBtn.addEventListener('click', () => {
            const nextUrl = new URLSearchParams(window.location.search).get('next');
            if (nextUrl) {
                const separator = nextUrl.includes('?') ? '&' : '?';
                window.location.href = `${nextUrl}${separator}codigos=${encodeURIComponent(Array.from(scannedCodes).join(','))}`;
            }
        });
    </script>
</body>
</html>
