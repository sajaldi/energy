{% extends "admin/base_site.html" %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-12">
            <h1>Detalle de Consumo Diario</h1>
            <h2>Medidor: {{ medidor_nombre }}</h2>
            <h3>Mes: {{ mes }}</h3>
            
            <div style="margin-top: 2rem; padding: 20px; background: #fff; border: 1px solid #ddd; border-radius: 5px;">
                <img src="data:image/png;base64,{{ grafico_diario_b64 }}" class="img-fluid" alt="Gráfico de consumo diario">
            </div>

            <div style="margin-top: 2rem;">
                <a href="javascript:history.back()" class="btn btn-secondary">« Volver al informe principal</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
