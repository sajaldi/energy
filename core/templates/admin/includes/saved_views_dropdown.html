{% load i18n %}
{% if show %}
<div class="dropdown d-inline-block mr-2" id="saved-views-container">
    <button class="btn btn-secondary dropdown-toggle" type="button" id="savedViewsDropdown" data-toggle="dropdown"
        aria-haspopup="true" aria-expanded="false" style="background: #4f46e5; border-color: #4338ca;">
        <i class="fas fa-eye mr-1"></i> {% trans "Vistas" %}
    </button>
    <div class="dropdown-menu dropdown-menu-right" aria-labelledby="savedViewsDropdown"
        style="min-width: 250px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);">
        <h6 class="dropdown-header">{% trans "Mis Vistas" %}</h6>
        {% for vista in vistas %}
        <div class="dropdown-item d-flex justify-content-between align-items-center view-item"
            data-url="?{{ vista.query_string|safe }}">
            <a href="?{{ vista.query_string|safe }}" class="flex-grow-1" style="color: inherit; text-decoration: none;">
                <i class="{{ vista.icono }} mr-2" style="color: {{ vista.color }};"></i> {{ vista.nombre }}
                {% if vista.es_publica %}<span class="badge badge-info ml-1" style="font-size: 10px;">{% trans "Pública"
                    %}</span>{% endif %}
            </a>
            {% if vista.usuario == request.user %}
            <button class="btn btn-xs btn-outline-danger border-0 delete-view" data-id="{{ vista.id }}"
                title="Eliminar view">
                <i class="fas fa-times"></i>
            </button>
            {% endif %}
        </div>
        {% empty %}
        <span class="dropdown-item text-muted small">{% trans "Sin vistas guardadas" %}</span>
        {% endfor %}

        <div class="dropdown-divider"></div>
        <button class="dropdown-item text-primary" id="btn-save-current-view" type="button">
            <i class="fas fa-save mr-2"></i> <strong>{% trans "Guardar vista actual..." %}</strong>
        </button>
    </div>
</div>

<!-- Modal para guardar vista -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Fallback robusto para abrir el menú (evita conflictos de Bootstrap)
        const dropdownBtn = document.getElementById('savedViewsDropdown');
        if (dropdownBtn) {
            const dropdownMenu = dropdownBtn.nextElementSibling;
            dropdownBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (dropdownMenu) {
                    dropdownMenu.classList.toggle('show');
                }
            });

            // Cerrar menú si se hace clic fuera
            document.addEventListener('click', function (e) {
                if (dropdownBtn && dropdownMenu && !dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                    dropdownMenu.classList.remove('show');
                }
            });
        }

        // Navegación al hacer clic en una vista (en cualquier parte de la fila excepto eliminar)
        document.querySelectorAll('.view-item').forEach(item => {
            item.addEventListener('click', function (e) {
                if (!e.target.closest('.delete-view')) {
                    window.location.href = this.dataset.url;
                }
            });
        });

        const btnSave = document.getElementById('btn-save-current-view');
        if (btnSave) {
            btnSave.onclick = async function () {
                const { value: formValues } = await Swal.fire({
                    title: '{% trans "Guardar Vista Personalizada" %}',
                    html:
                        '<input id="swal-input-name" class="swal2-input" placeholder="Nombre de la vista">' +
                        '<div class="form-check mt-3 text-left pl-5">' +
                        '  <input class="form-check-input" type="checkbox" id="swal-input-public">' +
                        '  <label class="form-check-label" for="swal-input-public">{% trans "¿Hacer pública?" %}</label>' +
                        '</div>',
                    focusConfirm: false,
                    showCancelButton: true,
                    confirmButtonText: '{% trans "Guardar" %}',
                    confirmButtonColor: '#4f46e5',
                    preConfirm: () => {
                        return {
                            nombre: document.getElementById('swal-input-name').value,
                            es_publica: document.getElementById('swal-input-public').checked
                        }
                    }
                });

                if (formValues && formValues.nombre) {
                    const payload = {
                        nombre: formValues.nombre,
                        es_publica: formValues.es_publica,
                        app_label: '{{ app_label }}',
                        model_name: '{{ model_name }}',
                        query_string: '{{ current_query }}'
                    };

                    fetch('{% url "core:guardar_vista" %}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify(payload)
                    })
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'success') {
                                Swal.fire({
                                    icon: 'success',
                                    title: '{% trans "Guardado" %}',
                                    text: data.message,
                                    timer: 1500,
                                    showConfirmButton: false
                                }).then(() => location.reload());
                            } else {
                                Swal.fire('Error', data.message, 'error');
                            }
                        });
                }
            };
        }

        // Eliminar vista
        document.querySelectorAll('.delete-view').forEach(btn => {
            btn.onclick = function (e) {
                e.preventDefault();
                e.stopPropagation();
                const id = this.dataset.id;

                Swal.fire({
                    title: '{% trans "¿Estás seguro?" %}',
                    text: '{% trans "Esta vista se eliminará permanentemente." %}',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    confirmButtonText: '{% trans "Sí, eliminar" %}'
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch(`{% url "core:eliminar_vista" 0 %}`.replace('0', id), {
                            method: 'POST',
                            headers: {
                                'X-CSRFToken': '{{ csrf_token }}'
                            }
                        })
                            .then(response => response.json())
                            .then(data => {
                                if (data.status === 'success') {
                                    location.reload();
                                }
                            });
                    }
                });
            };
        });
    });
</script>
{% endif %}
<style>
    .view-item:hover {
        background-color: #f8fafc;
    }

    .view-item .delete-view {
        opacity: 0;
        transition: opacity 0.2s;
    }

    .view-item:hover .delete-view {
        opacity: 1;
    }

    #saved-views-container .dropdown-item {
        padding: 0.5rem 1rem;
        cursor: pointer;
    }
</style>
