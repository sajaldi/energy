{% load static %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<div id="admin-chatbot-widget" class="chatbot-widget-container">
    <!-- Chat Window -->
    <div id="chatbot-window" class="chatbot-window hidden">
        <div class="chatbot-header">
            <div class="bot-identity">
                <div class="bot-avatar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path>
                        <rect x="4" y="8" width="16" height="12" rx="2"></rect>
                        <path d="M2 14h2"></path>
                        <path d="M20 14h2"></path>
                        <path d="M15 13v2"></path>
                        <path d="M9 13v2"></path>
                    </svg>
                </div>
                <div class="bot-info">
                    <h4>Asistente AI</h4>
                    <span>En línea</span>
                </div>
            </div>
            <div class="chatbot-actions">
                <button id="clear-chatbot" class="action-btn" title="Limpiar chat">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </button>
                <button id="close-chatbot" class="close-btn">&times;</button>
            </div>
        </div>

        <div id="chatbot-messages" class="chatbot-messages">
            <div class="message bot">
                <div class="message-content">
                    Hola, soy tu asistente administrativo. ¿En qué puedo ayudarte hoy?
                </div>
            </div>
        </div>

        <!-- Quick Menu -->
        <div class="chatbot-quick-menu">
            <button class="quick-action-btn" data-action="crear_aviso">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                    </path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                Crear Aviso
            </button>
            <button class="quick-action-btn" data-action="crear_orden">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                Crear Orden
            </button>
            <button class="quick-action-btn" data-action="consultar_estado">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Estado Activos
            </button>
            <button class="quick-action-btn" data-action="ver_calendario">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                Calendario
            </button>
            <button class="quick-action-btn" data-action="mis_tareas">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Mis Tareas
            </button>
        </div>

        <div class="chatbot-input-area">
            <input type="text" id="chatbot-input" placeholder="Escribe tu consulta..." autocomplete="off">
            <button id="chatbot-send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button id="chatbot-trigger" class="chatbot-fab">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>
</div>

<style>
    /* Widget Container */
    .chatbot-widget-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Floating Button */
    .chatbot-fab {
        width: 60px;
        height: 60px;
        border-radius: 30px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        border: none;
        color: white;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .chatbot-fab:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.5);
    }

    /* Chat Window */
    .chatbot-window {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 350px;
        height: 500px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.5);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: opacity 0.3s, transform 0.3s;
        transform-origin: bottom right;
    }

    .chatbot-window.hidden {
        opacity: 0;
        transform: scale(0.9);
        pointer-events: none;
    }

    /* Header */
    .chatbot-header {
        padding: 16px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .bot-identity {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .bot-avatar {
        width: 36px;
        height: 36px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .bot-info h4 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: white;
    }

    .bot-info span {
        font-size: 0.75rem;
        opacity: 0.8;
    }

    .chatbot-actions {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .action-btn {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        padding: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.8;
        transition: opacity 0.2s, transform 0.2s;
    }

    .action-btn:hover {
        opacity: 1;
        transform: scale(1.1);
    }

    .close-btn {
        background: none;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0;
        line-height: 1;
        opacity: 0.8;
    }

    .close-btn:hover {
        opacity: 1;
    }

    /* Messages Area */
    .chatbot-messages {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        background-color: #f8fafc;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .message {
        max-width: 85%;
        font-size: 0.9rem;
        line-height: 1.5;
    }

    .message.bot {
        align-self: flex-start;
    }

    .message.user {
        align-self: flex-end;
    }

    .message-content {
        padding: 10px 14px;
        border-radius: 12px;
    }

    .message.bot .message-content {
        background: white;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 4px;
        color: #1e293b;
    }

    .message.bot .message-content h1, 
    .message.bot .message-content h2, 
    .message.bot .message-content h3 {
        font-size: 1.1rem;
        margin-top: 10px;
        margin-bottom: 5px;
        color: #2563eb;
    }

    .message.bot .message-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0;
        font-size: 0.85rem;
    }

    .message.bot .message-content th, 
    .message.bot .message-content td {
        border: 1px solid #e2e8f0;
        padding: 6px;
        text-align: left;
    }

    .message.bot .message-content th {
        background: #f8fafc;
    }

    .message.user .message-content {
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 4px;
    }

    .message.loading .message-content {
        background: #f1f5f9;
        color: #64748b;
        font-style: italic;
    }

    /* Input Area */
    .chatbot-input-area {
        padding: 12px;
        background: white;
        border-top: 1px solid #e2e8f0;
        display: flex;
        gap: 8px;
    }

    #chatbot-input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
    }

    #chatbot-input:focus {
        border-color: #2563eb;
    }

    #chatbot-send-btn {
        background: #2563eb;
        color: white;
        border: none;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
    }

    #chatbot-send-btn:hover {
        background: #1d4ed8;
        transform: scale(1.1);
    }

    #chatbot-send-btn:disabled {
        background: #94a3b8;
        cursor: not-allowed;
    }

    /* Quick Menu */
    .chatbot-quick-menu {
        padding: 8px 12px;
        background: #f1f5f9;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        white-space: nowrap;
        border-top: 1px solid #e2e8f0;
        scrollbar-width: none;
        /* Firefox */
    }

    .chatbot-quick-menu::-webkit-scrollbar {
        display: none;
        /* Safari/Chrome */
    }

    .quick-action-btn {
        background: white;
        border: 1px solid #cbd5e1;
        border-radius: 16px;
        padding: 6px 12px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #475569;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .quick-action-btn:hover {
        background: #2563eb;
        color: white;
        border-color: #2563eb;
        transform: translateY(-1px);
    }

    .quick-action-btn svg {
        transition: stroke 0.2s;
    }

    .quick-action-btn:hover svg {
        stroke: white;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const trigger = document.getElementById('chatbot-trigger');
        const window = document.getElementById('chatbot-window');
        const closeBtn = document.getElementById('close-chatbot');
        const input = document.getElementById('chatbot-input');
        const sendBtn = document.getElementById('chatbot-send-btn');
        const messagesContainer = document.getElementById('chatbot-messages');

        // Persistence Configuration
        const STORAGE_KEY = 'chatbot_history_{{ request.user.id|default:"anon" }}';
        const INACTIVITY_LIMIT = 10 * 60 * 1000; // 10 minutes in ms

        trigger.addEventListener('click', () => {
            window.classList.toggle('hidden');
            saveChatState();
            if (!window.classList.contains('hidden')) {
                input.focus();
            }
        });

        closeBtn.addEventListener('click', () => {
            window.classList.add('hidden');
            saveChatState();
        });

        // Clear Chat
        const clearBtn = document.getElementById('clear-chatbot');
        clearBtn.addEventListener('click', () => {
            if (confirm('¿Estás seguro de que deseas limpiar el historial del chat?')) {
                messagesContainer.innerHTML = `
                    <div class="message bot">
                        <div class="message-content">
                            Hola, soy tu asistente administrativo. ¿En qué puedo ayudarte hoy?
                        </div>
                    </div>
                `;
                conversationHistory = [];
                localStorage.removeItem(STORAGE_KEY);
                saveChatState();
            }
        });

        // Quick Actions
        document.querySelectorAll('.quick-action-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.getAttribute('data-action');
                let message = "";

                if (action === 'crear_aviso') {
                    message = "Quiero crear un nuevo aviso de falla";
                } else if (action === 'crear_orden') {
                    message = "Necesito crear una nueva orden de trabajo";
                } else if (action === 'consultar_estado') {
                    message = "¿Cuál es el estado actual de los equipos?";
                } else if (action === 'ver_calendario') {
                    message = "Muéstrame el calendario de mantenimiento";
                } else if (action === 'mis_tareas') {
                    message = "¿Cuáles son mis tareas pendientes para hoy?";
                }

                if (message) {
                    input.value = message;
                    sendMessage();
                }
            });
        });

        // Send Message
        // Historial de conversación para mantener contexto
        let conversationHistory = [];

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            appendMessage(text, 'user');
            input.value = '';

            // Add loading state
            const loadingId = appendMessage('Escribiendo...', 'bot', true);
            sendBtn.disabled = true;

            try {
                const response = await fetch('{% url "proyectos:chatbot_asistente" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ 
                        mensaje: text,
                        historial: conversationHistory
                    })
                });

                const data = await response.json();

                // Remove loading
                document.getElementById(loadingId).remove();

                if (data.status === 'success') {
                    // Guardar en historial
                    conversationHistory.push({role: 'user', content: text});
                    conversationHistory.push({role: 'assistant', content: data.respuesta});
                    // Mantener solo últimos 10 mensajes para no exceder tokens
                    if (conversationHistory.length > 20) {
                        conversationHistory = conversationHistory.slice(-20);
                    }
                    appendMessage(data.respuesta, 'bot');
                } else {
                    appendMessage('Error: ' + data.message, 'bot');
                }

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Error de conexión.', 'bot');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function appendMessage(text, type, isLoading = false) {
            const id = 'msg-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type} ${isLoading ? 'loading' : ''}`;
            msgDiv.id = id;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (type === 'bot' && !isLoading) {
                // Renderizar Markdown para el bot
                contentDiv.innerHTML = marked.parse(text);
            } else {
                contentDiv.innerHTML = text.replace(/\n/g, '<br>');
            }

            msgDiv.appendChild(contentDiv);
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            if (!isLoading) {
                saveChatHistory();
            }

            return id;
        }

        // Persistence Logic

        function saveChatHistory() {
            const messages = [];
            // Skip the first hardcoded message if we want, or just save all
            document.querySelectorAll('#chatbot-messages .message:not(.loading)').forEach(msg => {
                messages.push({
                    text: msg.querySelector('.message-content').innerHTML,
                    type: msg.classList.contains('user') ? 'user' : 'bot'
                });
            });

            const data = {
                lastActive: Date.now(),
                messages: messages,
                isOpen: !window.classList.contains('hidden')
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function saveChatState() {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            data.isOpen = !window.classList.contains('hidden');
            data.lastActive = Date.now();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadChatHistory() {
            const rawData = localStorage.getItem(STORAGE_KEY);
            if (!rawData) return;

            try {
                const data = JSON.parse(rawData);
                const now = Date.now();

                // Check inactivity
                if (now - data.lastActive > INACTIVITY_LIMIT) {
                    localStorage.removeItem(STORAGE_KEY);
                    return;
                }

                // Restore messages
                if (data.messages && data.messages.length > 0) {
                    // Clear current (the hardcoded one is already there, 
                    // if the first saved is identical, we might want to skip it)
                    const savedMessages = data.messages;

                    // Identify if the first saved is the welcome message to avoid duplication
                    const welcomeText = "Hola, soy tu asistente administrativo basado en <strong>n8n</strong>. ¿En qué puedo ayudarte hoy?";

                    messagesContainer.innerHTML = ''; // Clear everything

                    savedMessages.forEach(msg => {
                        const msgDiv = document.createElement('div');
                        msgDiv.className = `message ${msg.type}`;
                        const contentDiv = document.createElement('div');
                        contentDiv.className = 'message-content';
                        contentDiv.innerHTML = msg.text;
                        msgDiv.appendChild(contentDiv);
                        messagesContainer.appendChild(msgDiv);
                    });
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }

                // Restore window state
                if (data.isOpen) {
                    window.classList.remove('hidden');
                }

            } catch (e) {
                console.error("Error restoring chat history", e);
            }
        }

        // Initialize history
        loadChatHistory();

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Helper for CSRF
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    });
</script>
